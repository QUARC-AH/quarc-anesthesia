/* レポートに載せるグラフ。画面の幅に関係なく同じ形で描き、
   表示と紙の両方で、枠にあわせて縮めます（線の絵なので縮めても読めます） */
function repChart(c){
  const z=chartZoom, e=CHART_EXP;
  chartZoom='fit'; CHART_EXP=1000;
  try{ return vchart(c); } finally { chartZoom=z; CHART_EXP=e; }
}

/* ---- グラフを画像にする ----
   画面の見た目ではなく、決まった幅で描き直してから PNG にします。
   外から読み込むものが無い絵なので、端末の中だけで変換できます。 */
function chartPNG(c,W){
  W=W||1100;
  const z=chartZoom, e=CHART_EXP;
  let svg; chartZoom='fit'; CHART_EXP=W;
  try{ svg=vchart(c); } finally { chartZoom=z; CHART_EXP=e; }
  if(!svg||svg.indexOf('<svg')<0) return Promise.resolve(null);
  /* 単独の画像になるので、書体と白い下地を書き足します */
  svg=svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '
      +'font-family="-apple-system,BlinkMacSystemFont,Hiragino Sans,Meiryo,sans-serif" ')
     .replace(/(<svg[^>]*>)/,'$1<rect width="100%" height="100%" fill="#ffffff"/>');
  const m=svg.match(/width="(\d+)"\s+height="(\d+)"/);
  const w=m?+m[1]:W, h=m?+m[2]:600, S=2;   /* 2倍で描いて、紙でも荒れないようにします */
  let url; try{ url='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg))); }
  catch(err){ return Promise.resolve(null); }
  return new Promise(res=>{
    const img=new Image();
    const done=v=>{ clearTimeout(tm); res(v); };
    const tm=setTimeout(()=>done(null),8000);
    img.onload=()=>{ try{
        const cv=document.createElement('canvas'); cv.width=w*S; cv.height=h*S;
        const g=cv.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,cv.width,cv.height);
        g.drawImage(img,0,0,cv.width,cv.height);
        done(cv.toDataURL('image/png'));
      }catch(err){ done(null); } };
    img.onerror=()=>done(null);
    img.src=url;
  });
}

/* 設定画面の「接続を確認」。フォルダの名前が返れば、つながっています */

  if(!url){ toast('URL を入れてください'); return; }

/* ---- グラフを画像としてコピーする ----
   ドキュメントに貼り付けるための機能。Safari では「押した流れの中で」
   クリップボードに渡す必要があるため、画像ができるのを待たずに約束（Promise）を渡します。 */
const chartBlob=(c,W)=>chartPNG(c,W).then(d=>{
  if(!d) throw new Error('画像にできませんでした');
  return fetch(d).then(r=>r.blob());
});
/* グラフに出せる記録があるか */
function chartHas(c){ try{ const s=vchart(c); return !!s&&s.indexOf('<svg')>=0; }catch(e){ return false; } }
function copyChart(){
  const c=cur;
  if(!chartHas(c)){ toast('グラフに出せる記録がまだありません'); return; }
  if(!(navigator.clipboard&&navigator.clipboard.write&&window.ClipboardItem)){ chartImgModal(c); return; }
  let item;
  const bp=chartBlob(c);
  bp.catch(()=>{});            /* 失敗しても「未処理」にしない。下の catch で拾います */
  try{ item=new ClipboardItem({'image/png':bp}); }
  catch(e){ chartImgModal(c); return; }
  navigator.clipboard.write([item])
    .then(()=>toast('グラフをコピーしました。ドキュメントに貼り付けてください'))
    .catch(()=>chartImgModal(c));
}
/* コピーが使えない端末のために、画像そのものを出します（長押しで保存・コピー） */
function chartImgModal(c){
  if(!chartHas(c)){ toast('グラフに出せる記録がまだありません'); return; }
  toast('画像を作っています…');
  chartPNG(c).then(d=>{
    if(!d){ toast('グラフを画像にできませんでした'); return; }
    openModal(`<h2>麻酔記録グラフ</h2>

/* ---- Google Drive へのバックアップ ----
   麻酔終了（抜管）のときに、レポート(PDF)・記録(JSON)・グラフ(PNG)を院内の Drive に残します。
   圏外のときは「送信待ち」にして、つながった時点で自動で送り直します。 */
async function backupCase(c,silent){
  const url=cfg('backupUrl');
  if(!url){ if(!silent){ toast('設定で バックアップ先の URL を登録してください'); openSettings(); } return false; }
  const m=c.meta||{};
  let png=null; try{ png=await chartPNG(c); }catch(e){}
  const body={action:'backup', id:c.id, date:m.date||'', name:m.patientName||'',
    pid:m.patientId||'', site:m.site||'', ver:APP_VER,
    report:reportText(c), json:JSON.stringify(c), png:png?png.split(',')[1]:''};
  try{
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body)});
    const j=JSON.parse(await r.text());
    if(!j.ok) throw new Error(j.error||'不明');
    c.meta.backupAt=new Date().toISOString(); c.meta.backupFiles=(j.files||[]).join(' / ');
    c.meta.backupDir=j.folder||''; delete c.meta.backupPend; save(); render();
    toast(`${m.patientName||'症例'}：Drive に保存しました`+(j.folder?`（${j.folder}）`:''));
    return true;
  }catch(e){
    c.meta.backupPend=true; save(); render();
    if(!silent) toast('いま保存できませんでした。回線が戻ったときに自動で送ります');
    return false;
  }
}
/* 送信待ちのものを、つながったときにまとめて送ります */
async function backupRetry(){
  if(!cfg('backupUrl')) return;
  if(typeof navigator!=='undefined'&&navigator.onLine===false) return;
  const list=db.cases.filter(x=>x&&x.meta&&x.meta.backupPend);
  for(const c of list){ await backupCase(c,true); }
}
if(typeof window!=='undefined') window.addEventListener('online',()=>setTimeout(backupRetry,1500));

  document.querySelectorAll('select[data-staff]').forEach(n=>n.onchange=()=>{
    cur.meta[n.dataset.staff]=n.value;
    /* 執刀医を選ぶと、名簿の所属科から診療科を補います（未入力のときだけ） */
    if(n.dataset.staff==='surgeon'&&n.value&&!cur.meta.dept){
      const st=staffFind(n.value), raw=st&&st.d?st.d.split('・')[0]:'';
      const d=DEPTMAP[raw]!=null?DEPTMAP[raw]:raw;

    }

  const grow=n=>{ if(n.tagName!=='TEXTAREA')return; n.style.height='auto'; n.style.height=(n.scrollHeight+2)+'px'; };

  document.querySelectorAll('select[data-dcat]').forEach(n=>n.onchange=()=>{

}
/* 執刀は獣医師のみ。それ以外は獣医師＋看護師で「なし」も選べる。
   遠隔麻酔があるので、他拠点の人も下のグループから選べます */
function staffSel(l,k,m,vetOnly,ph){
  const vets=staffBy('vet'), nss=staffBy('ns');
  const ovets=staffBy('vet',1), onss=staffBy('ns',1);
  const v=staffCanon(m[k]||''), st=siteName(), other=st==='東京'?'名古屋':'東京';
  const opt=n=>`<option value="${esc(n)}"${v===n?' selected':''}>${esc(n)}</option>`;
  const g=(lab,a)=>a.length?`<optgroup label="${esc(lab)}">${a.map(opt).join('')}</optgroup>`:'';
  const known=[...vets,...nss,...ovets,...onss];
  return `<label class="f">${l?`<span>${l}</span>`:''}
    <select data-staff="${k}">
      <option value=""${v?'':' selected'}>${ph||(vetOnly?'— 選択 —':'なし')}</option>
      ${g('獣医師',vets)}
      ${vetOnly?'':g('看護師',nss)}
      ${g(other+'の獣医師',ovets)}
      ${vetOnly?'':g(other+'の看護師',onss)}
      ${v&&known.indexOf(v)<0?g('その他',[v]):''}
    </select></label>`;
}
/* 2時間まで通常、以降30分ごとに超過1 */
function suggestOv(c){ const t=times(c).anes; return (t==null||t<=120)?0:Math.ceil((t-120)/30); }
const ovText=n=>n===0?'なし':n===1?'超過':'超過'+n;
function anesTypeText(c){ const m=c.meta, b=m.anesType||'全身麻酔';
  if(b==='鎮静') return b; const o=m.overrun||'なし';
  return o==='なし'?b:`${b}（${o}）`; }

/* ---- 手術集計（18列） ---- */
const TCOL=['日時','導入時間','麻酔種別','患者名','動物','手術分類','手術名','OPE時間','麻酔時間',
 '導入＋移動','覚醒＋Xray/包帯','オペ担当','助手','麻酔担当','オンライン麻酔','麻酔補助','術中合併症','術後合併症'];
function tallyRow(c){
  const m=c.meta,t=times(c);
  return [String(m.date).replace(/-/g,'/'), c.chart.anesStart||'', anesTypeText(c), m.patientName||'', m.species||'',
    m.dept||'', m.procedure||'', t.ope??'', t.anes??'', t.ind??'', t.wake??'',
    m.surgeon||'', m.assistant||'', m.anesthetist||'', m.onlineAnes||'', m.vt||'',
    m.intraComp||'', m.postComp||''];
}
/* 書き出しに必須の項目。手術集計の18列を埋めるのに要るものを全て確認します
   （助手・オンライン麻酔・麻酔補助・合併症は空欄が通常のため対象外） */
function tallyMissing(c){
  const m=c.meta,t=times(c);
  return coreMissing(c).concat(
    !m.patientId?['カルテ番号']:[], !m.procedure?['術式']:[],
    !m.species?['動物種']:[], !m.dept?['診療科']:[],
    !c.chart.anesStart?['導入']:[], !c.chart.opeStart?['手術開始（切皮）']:[],
    !c.chart.opeStop?['手術終了']:[], !c.chart.anesStop?['抜管']:[],
    t.ind==null||t.ope==null||t.wake==null||t.anes==null?['時間の計算']:[],
    !m.surgeon?['オペ担当']:[]);
}
/* 麻酔が終わったのに手術集計へ書き出していない症例 */
const needsTally=c=>statusOf(c).k==='done'&&!c.meta.tallyAt;
function showTallyWarn(){
  const n=document.getElementById('t_warn'); if(!n)return;
  const miss=tallyMissing(cur), t=times(cur), sug=suggestOv(cur), cu=cur.meta.overrun||'なし';
  let h='';
  if(miss.length) h+=`<div style="border:1px solid #eccdc8;background:#fdf3f2;color:var(--warn);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:700">⚠ ${miss.join('、')} が未入力のため書き出せません</div>`;
  else if(cur.meta.tallyAt) h+=`<div style="color:var(--ok);font-weight:800;font-size:12.5px">✓ ${new Date(cur.meta.tallyAt).toLocaleString('ja-JP')} に書き出し済みです</div>`;
  else h+=`<div style="color:var(--ok);font-weight:800;font-size:12.5px">✓ 必要な項目が揃っています</div>`;
  const btn=document.getElementById('t_push');
  if(btn){ btn.disabled=miss.length>0; btn.style.opacity=miss.length?0.45:1; }
  if(t.anes!=null&&sug>0&&cu!==ovText(sug))
    h+=`<div style="border:1px solid #f0dcae;background:#fff8e6;color:var(--amber);border-radius:9px;padding:8px 10px;font-size:12.5px;font-weight:700;margin-top:6px">⚠ 麻酔${t.anes}分の目安は ${ovText(sug)} です（現在 ${cu}）</div>`;
  n.innerHTML=h;
}
const tlog=s2=>{const n=document.getElementById('t_log');if(n)n.textContent=(new Date().toLocaleTimeString('ja-JP')+' '+s2+'\n'+n.textContent).slice(0,900)};
function tallyTSV(){ return tallyRow(cur).map(v=>String(v).replace(/[\t\r\n]/g,' ')).join('\t'); }
function copyTally(){ navigator.clipboard.writeText(tallyTSV())
  .then(()=>toast('コピーしました。シートのA列に貼り付けてください'))
  .catch(()=>openModal(`<h2>コピー用</h2><textarea style="min-height:120px;font-size:11px">${esc(tallyTSV())}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary sp" onclick="closeModal()">閉じる</button></div>`)); }
/* 設置直後の確認用。書き込まずに、シートのタブ名だけを見に行きます */
async function tallyCheck(){
  const url=cfg('tally_'+siteName());
  if(!url){ tlog(`${siteName()}の手術集計シートのURLが未設定です。\n`
    +'院内設定（SITE_CONFIG）の tally_'+siteName()+' に、Apps Script の /exec を入れてください。'); return; }
  try{ tlog('確認中…');
    const r=await fetch(url+(url.indexOf('?')<0?'?':'&')+'action=sheets',{method:'GET'});
    const j=JSON.parse(await r.text());
    if(!j.ok) throw new Error(j.error||'応答が読めません');
    const now=new Date(), want=now.getFullYear()+'.'+(now.getMonth()+1);
    const hit=(j.sheets||[]).some(x=>String(x).replace(/[\s　]/g,'').replace(/月$/,'')===want);
    tlog(`つながりました（${(j.sheets||[]).length}タブ）\n`
      +(j.sheets||[]).join(' / ')+'\n'
      +(hit?`今月（${want}）のタブがあります`
           :`今月（${want}）のタブは見当たりません。書き込み時に「テンプレ のコピー」から自動で作られます`));
    toast(`${siteName()}の手術集計につながりました`);
  }catch(e){ tlog('つながりません: '+e.message
    +'\n・URL が /exec で終わっているか\n・デプロイのアクセス権が「全員」になっているか\nをご確認ください'); }
}
async function pushTally(){
  const url=cfg('tally_'+siteName());
  if(!url){ toast('設定で手術集計シートのURLを登録してください'); openSettings(); return; }
  const miss=tallyMissing(cur);
  if(miss.length){ toast(`${miss.join('・')} が未入力のため書き出せません`); return; }
  /* 失敗したときに「なぜ」が分かるように、返ってきた内容まで見て知らせます */
  try{ tlog('送信中…');
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'appendTally',rows:[tallyRow(cur)]})});
    const body=await r.text();
    let j=null; try{ j=JSON.parse(body); }catch(e){}
    if(!j){
      const why=/accounts\.google\.com|ServiceLogin|ログイン|Sign in/i.test(body)
        ? 'Apps Script がログインを求めています。\nデプロイの「アクセスできるユーザー」を［全員］にしてください。'
        : /script\.google\.com|<html/i.test(body)
        ? 'シートの代わりに Google のページが返ってきました。\n・URL が /exec で終わっているか\n・デプロイが有効か\nをご確認ください。'
        : 'シートからの返事が読めませんでした。';
      tlog('失敗：'+why+'\n返事の先頭：'+body.slice(0,80));
      toast('書き込めませんでした。理由が下に出ています'); return;
    }
    if(j.ok){ cur.meta.tallyAt=new Date().toISOString(); save();
      tlog(`「${j.sheet}」に 追加${j.written} / 更新${j.updated}`); toast(`${siteName()}「${j.sheet}」に書き込みました`); }
    else { tlog('シート側のエラー：'+(j.error||'不明')); toast('書き込みに失敗しました。理由が下に出ています'); }
  }catch(e){
    const off=(typeof navigator!=='undefined'&&navigator.onLine===false);
    tlog('失敗：'+(off?'オフラインです。回線が戻ってからもう一度お試しください。'
      :'シートに届きませんでした。\n・デプロイの「アクセスできるユーザー」が［全員］か\n・URL が /exec で終わっているか\nをご確認ください。')
      +'\n'+String(e.message||e));
    toast('書き込めませんでした。理由が下に出ています');
  }
}

/* 時間・バイタル・イベントを全て縦持ちで書き出す */
function exportTSV(){
  const c=cur,m=c.meta,rows=[['日時','患者名','カルテ番号','体重','時刻','種別','項目','値']];
  Object.keys(c.chart.v).sort().forEach(t=>{const o=c.chart.v[t];
    allFields().forEach(f=>{ if(o[f.k]!=null&&o[f.k]!=='') rows.push([m.date,m.patientName,m.patientId,m.bw,t,'測定',f.l,o[f.k]]); })});
  c.events.forEach(e=>rows.push([m.date,m.patientName,m.patientId,m.bw,e.t,'イベント',e.l,'']));
  c.postop.rows.forEach(r=>{ POV.forEach(v=>{ if(r[v.k])
    rows.push([m.date,m.patientName,m.patientId,m.bw,r.t,'術後',
      v.k==='temp'&&r.tsite?`体温（${r.tsite}）`:v.l, r[v.k]]); });
    if(r.consc) rows.push([m.date,m.patientName,m.patientId,m.bw,r.t,'術後','意識',r.consc]);
    if(r.by)    rows.push([m.date,m.patientName,m.patientId,m.bw,r.t,'術後','担当',r.by]); });
  c.doses.forEach(d=>rows.push([m.date,m.patientName,m.patientId,m.bw,d.t,d.po?'術後投薬':'投薬',
    d.name+(d.pot?'（'+d.pot+'）':''),
    (perKg(d,bw(c))||'')+(d.amt?' / '+d.amt+' '+(d.unit||'mL'):'')+' '+(d.route||'')
      +(d.by?' / 実施 '+d.by:'')+(d.ord?' / 指示 '+d.ord:'')]));
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>toast(`${rows.length-1} 行をコピーしました`))
    .catch(()=>{ openModal(`<h2>コピー用データ</h2><textarea style="min-height:220px;font-size:11px">${esc(tsv)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn primary sp" onclick="closeModal()">閉じる</button></div>`); });
}

/* ================= 複数人での同時利用（Cloud Firestore） =================
   症例をフィールド単位で同期する。誰かが入力した値は他の端末にすぐ反映され、
   別の項目を同時に触っても互いの入力が消えない。 */
let FB={on:false,fs:null,db:null,un:null,unP:null,unPre:null,synced:{},peers:[],hb:null,timer:null,at:null,pend:false,err:'',lastBy:'',dirty:{}};
const CLIENT='cl_'+Math.floor(performance.timeOrigin).toString(36)+'_'+String(performance.now()).replace('.','').slice(0,8);
const myName=()=>store.get('myName')||'';
/* 投薬などの1行は「まとめて1つの値」として扱う。
   こうすると、消したときにその行ごと消え、空の行が残らない */
const KEYRE=new RegExp('^('+KEYED.map(p=>p.replace('.','\\.')).join('|')+')\\.[^.]+$');
const META=['id','_by','_at'];
function flat(o,b,out){ out=out||{}; b=b||'';
  if(b&&KEYRE.test(b)){ out[b]=o; return out; }
  if(o===null||typeof o!=='object'||Array.isArray(o)){ if(b)out[b]=o; return out; }
  for(const k of Object.keys(o)) flat(o[k], b?b+'.'+k:k, out); return out; }
const eqv=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
const cln=o=>JSON.parse(JSON.stringify(o));
function setP(o,p,v){const k=p.split('.');let a=o;
  for(let i=0;i<k.length-1;i++){if(typeof a[k[i]]!=='object'||a[k[i]]===null)a[k[i]]={};a=a[k[i]];}
  if(v===undefined)delete a[k[k.length-1]];else a[k[k.length-1]]=v;}

/* ---- 同期用のかたち ----
   投薬・イベント・術後チェック・準備薬は、配列のままだと
   「丸ごと1つの値」として送られるため、2台が同時に1件ずつ足すと片方が消える。
   そこで送るときだけ 鍵つきの入れ物 に変えて、1件を1つの値として扱う。 */
function toSync(c){
  const o=cln(c);
  KEYED.forEach(p=>{ const a=getP(o,p); if(!Array.isArray(a))return;
    const m={}; a.forEach(x=>{ if(x&&x.k) m[x.k]=x; }); setP(o,p,m); });
  return o;
}
function fromSync(r){
  const o=cln(r);
  KEYED.forEach(p=>{ const m=getP(o,p);
    if(Array.isArray(m)){ return; }              /* 旧版のデータはそのまま */
    const a=[];
    Object.keys(m||{}).forEach(k=>{ const x=m[k];
      if(x&&typeof x==='object'&&Object.keys(x).length) a.push({...x,k}); });
    a.sort((x,y)=>String(x.t||'').localeCompare(String(y.t||''))||String(x.k).localeCompare(String(y.k)));
    setP(o,p,a); });
  return o;
}

async function fbConnect(silent){
  const cfgs=cfg('fbCfg'); if(!cfgs) return;
  let fcfg; try{fcfg=JSON.parse(cfgs.trim().charAt(0)==='{'?cfgs:'{'+cfgs+'}')}
  catch(e){ if(!silent)toast('Firebase設定が読めません'); return; }
  const em=cfg('fbEmail')||'';
  const fld=document.getElementById('s_pw');
  const pw=(fld&&fld.value)||store.get('fbPw')||SITE_CONFIG.fbPw||'';
  try{
    const [{initializeApp},fs,au]=await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js')]);
    const app=initializeApp(fcfg,'q'+Date.now()), auth=au.getAuth(app);
    await au.setPersistence(auth,au.browserLocalPersistence).catch(()=>{});
    if(!auth.currentUser){
      if(!em||!pw){ if(!silent)toast('メールアドレスとパスワードを入力してください'); return; }
      await au.signInWithEmailAndPassword(auth,em,pw);
    }
    let d; try{ d=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})}); }
    catch(e){ d=fs.getFirestore(app); }
    FB.fs=fs; FB.db=d; FB.on=true; store.set('fbOn','1');
    fbSubscribe(); toast('共同利用に接続しました'); render(); syncBar();
  }catch(e){ if(!silent)toast('接続できません: '+e.message); }
}
function fbSubscribe(){
  const fs=FB.fs; if(!fs||FB.un) return;
  const q=fs.query(fs.collection(FB.db,'anesCases'),fs.where('meta.date','>=',dayAgo(14)));
  FB.un=fs.onSnapshot(q,snap=>{
    let touched=false, added=0;
    snap.docs.forEach(dd=>{
      const r=dd.data(); if(!r||!r.id)return;
      let l=db.cases.find(x=>x.id===r.id);
      if(!l){ l=fix(fromSync(r)); db.cases.push(l); added++; FB.synced[r.id]=cln(r); return; }
      /* 相手が変えたところだけを取り込む。こちらだけが変えた項目は残す */
      const rf=flat(r), lf=flat(FB.synced[r.id]||{});
      const w=toSync(l); let n=0;
      const mine=(FB.dirty&&FB.dirty[r.id])||new Set();
      for(const k of Object.keys(rf)){ if(k==='id'||k==='_by'||k==='_at'||mine.has(k))continue;
        if(!FB.synced[r.id]||!eqv(rf[k],lf[k])){ setP(w,k,rf[k]); n++; } }
      for(const k of Object.keys(lf)){ if(!(k in rf)&&k!=='id'&&k!=='_by'&&k!=='_at'&&!mine.has(k)){ setP(w,k,undefined); n++; } }
      FB.synced[r.id]=cln(r);
      if(n){ const merged=fix(fromSync(w));
        Object.keys(l).forEach(k=>{ if(!(k in merged)) delete l[k]; });
        Object.assign(l,merged);
        if(r._by&&r._by!==(myName()||'—')) FB.lastBy=r._by;
        if(cur&&cur.id===r.id) touched=true; }
    });
    FB.at=Date.now();
    save();
    if(added) toast(`他の端末から ${added} 件を受信しました`);
    if(added||touched||view==='list') render();
    syncBar();
  },err=>console.warn(err));
  fbPresetsSub();
  fbPresence();
}

function fbPresetsSub(){
  const fs=FB.fs; if(!fs||FB.unPre) return;
  let first=true;
  FB.unPre=fs.onSnapshot(fs.collection(FB.db,'anesPresets'),sn=>{
    const remote=sn.docs.map(d=>d.data()).filter(x=>x&&x.id&&x.name);
    if(first){ /* この端末だけにあるものは、つながった時に送ります */
      first=false;
      const ids=new Set(remote.map(x=>x.id));
      PRESETS.filter(p=>!ids.has(p.id)).forEach(p=>{ remote.push(p); presetPush(p); });
    }
    PRESETS=presetSort(remote); presetSave();
    if(view==='prep') render();
  },()=>{});
}

  if(FB.on&&FB.fs) FB.fs.setDoc(FB.fs.doc(FB.fs.collection(FB.db,'anesPresets'),p.id),cln(p)).catch(()=>{});

const dayAgo=n=>{const d=new Date(Date.now()-n*86400000);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function fbPresence(){
  const fs=FB.fs; if(!fs)return;
  if(FB.unP){FB.unP();FB.unP=null} if(FB.hb){clearInterval(FB.hb);FB.hb=null}
  const col=fs.collection(FB.db,'anesPresence');
  /* 開いている症例が変わったときと、20秒ごとにだけ知らせる（書き込みを増やさないため） */
  let lastBeat='',lastAt=0;
  fbBeat=()=>{ if(!FB.on||!FB.fs)return;
    const sig=(cur?cur.id:'')+'|'+view;
    if(sig===lastBeat&&Date.now()-lastAt<20000) return;
    lastBeat=sig; lastAt=Date.now();
    FB.fs.setDoc(FB.fs.doc(FB.fs.collection(FB.db,'anesPresence'),CLIENT),
      {name:myName()||'—',at:Date.now(),case:cur?cur.id:'',view}).catch(()=>{}); };
  const beat=fbBeat;
  beat(); FB.hb=setInterval(beat,20000);
  FB.unP=fs.onSnapshot(col,sn=>{ const t=Date.now();
    FB.peers=sn.docs.filter(d=>d.id!==CLIENT).map(d=>d.data()).filter(p=>p&&t-(p.at||0)<70000&&p.name);
    const h=document.getElementById('hSub');
    if(view==='list'&&h&&FB.peers.length) h.textContent=h.textContent.split(' ／ ')[0]+' ／ 👥 '+FB.peers.map(p=>p.name).join('、');
    syncBar();
  },()=>{});
}
/* ---- 同期の状態を常に見えるところに出す ----
   遠隔麻酔では「今つながっているか」が分からないと怖いので、画面上部に常時表示します */
/* 共用端末では、今その端末を持っている人が誰かを常に見えるようにします */
const isShared=()=>store.get('devMode')==='shared';
/* ---- 新しい版のお知らせ ----
   配信されているファイルの版数だけを見に行き、いま動いている版と違えば帯を出します。
   勝手に開き直すことはしません（術中に画面が切り替わらないように）。 */
let NEWVER=null, UPDHIDE=false;
async function checkUpdate(){
  if(NEWVER||UPDHIDE) return;
  if(location.protocol==='file:') return;          /* 手元のファイルを開いているときは見ません */
  if(typeof navigator!=='undefined'&&navigator.onLine===false) return;
  try{
    const r=await fetch('./index.html?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) return;
    const m=(await r.text()).match(/APP_VER\s*=\s*'([^']+)'/);
    if(m&&m[1]&&m[1]!==APP_VER){ NEWVER=m[1]; updBar(); }
  }catch(e){}
}
function updBar(){
  const n=document.getElementById('updbar'); if(!n) return;
  if(!NEWVER||UPDHIDE){ n.classList.add('hide'); n.innerHTML=''; return; }
  n.classList.remove('hide');
  n.innerHTML=`<span>新しい版 <b>${esc(NEWVER)}</b> が出ています（いまは ${esc(APP_VER)}）</span>
    <span class="sp"></span>
    <button onclick="applyUpdate()">いま新しくする</button>
    <button class="later" onclick="UPDHIDE=true;updBar()">あとで</button>`;
}
/* 端末に残っている古い控えを消してから開き直します。記録は消えません */
async function applyUpdate(){
  if(FB.pend&&!confirm('まだ送れていない記録があります。先に回線を確かめてください。\nこのまま新しくしますか？')) return;
  save();
  try{ if(window.caches){ const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k))); } }catch(e){}
  /* Safari が持っている古い控えも置き換えてから開き直します
     （これをしないと、消したそばから同じ古い版が返ってくることがあります） */
  try{ await fetch('./index.html',{cache:'reload'}); }catch(e){}
  try{ if(navigator.serviceWorker){
    const rs=await navigator.serviceWorker.getRegistrations();
    await Promise.all(rs.map(r=>r.update().catch(()=>{}))); } }catch(e){}
  setTimeout(()=>location.reload(),300);
}
function syncBar(){
  const n=document.getElementById('syncbar'); if(!n) return;
  const hasFb=!!cfg('fbCfg');
  n.classList.remove('hide','off','pend');
  const off=!navigator.onLine;
  let txt='',cls='';
  if(!hasFb){ txt=''; }
  else if(!FB.on){ cls='off'; txt='同期していません — 設定から接続してください'; }
  else if(off){ cls='pend'; txt='オフライン — 記録はこの端末に残り、回線が戻ると自動で送られます'; }
  else if(FB.pend){ cls='pend'; txt='送信待ち'+(FB.err?'（'+esc(FB.err.slice(0,40))+'）':''); }
  else { txt='同期中'; }
  if(cls) n.classList.add(cls);
  const ago=FB.at?Math.round((Date.now()-FB.at)/1000):null;
  const here=cur?FB.peers.filter(p=>p.case===cur.id).map(p=>p.name):[];
  /* 左：今この端末を使っている人（タップで交代） */
  const who=`<button class="whobtn${isShared()?' sh':''}" onclick="event.stopPropagation();switchUser()">👤 ${
    myName()?esc(myName()):'<span style="color:var(--warn)">使用者を選ぶ</span>'}${
    isShared()?' <span class="swap">交代</span>':''}</button>`;
  n.innerHTML=who
    +(txt?`<span class="dotp"></span><span>${txt}</span>`:'')
    +(hasFb&&FB.on&&!off&&FB.at!=null?`<em>最終 ${ago<60?ago+'秒前':Math.round(ago/60)+'分前'}</em>`:'')
    +`<span class="sp"></span>`
    +(here.length?`<em>👥 ${here.map(esc).join('、')} が同じ症例を開いています</em>`
      :FB.peers.length?`<em>👥 ${FB.peers.map(p=>esc(p.name)).join('、')}</em>`
      :(hasFb&&FB.on?'<em>接続はこの端末のみ</em>':''));
}

/* ---- 使用者の交代 ----
   麻酔中の症例を開いていれば「記録者 ○○」として経過に残します */
function switchUser(){
  const live=db.cases.filter(c=>statusOf(c).k==='live');
  const target=(cur&&statusOf(cur).k==='live')?cur:(live.length===1?live[0]:null);
  openModal(`<h2>使用者の交代</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 10px">
      いま この端末を使う人を選んでください。${myName()?`現在は <b>${esc(myName())}</b> です。`:''}</p>
    ${staffSel('交代する人','me',{me:''},false,'— 選んでください —')}
    ${target?`<div class="warnbox" style="margin-top:12px;background:#eef4f7;border-color:var(--line);color:var(--ink2)">
      ${esc(target.meta.patientName||'（無題）')}（麻酔中）の経過に、<b>交代した時刻が記録されます。</b></div>`:''}
    <div class="row" style="margin-top:16px">
      <button class="btn sp" onclick="closeModal()">キャンセル</button>
      <button class="btn primary sp" onclick="switchUserSave('${target?target.id:''}')">交代する</button></div>`);
}
function switchUserSave(id){
  const sel=document.querySelector('select[data-staff="me"]');
  const n=sel?sel.value:'';
  if(!n){ toast('名前を選んでください'); return; }
  const prev=myName();
  store.set('myName',n); store.set('lastUse',String(Date.now()));
  const c=id?byId(id):null;
  if(c&&n!==prev){
    c.events.push({k:uid(),t:nowHM(),kk:'staff',l:`記録者 ${n}`+(prev?`（前：${prev}）`:'')});
    const keep=cur; cur=c; save(); cur=keep;
  }
  closeModal(); render();
  if(typeof fbBeat==='function'&&fbBeat) fbBeat();
  toast(`${n} さんに交代しました`);
}
addEventListener('online',()=>{ syncBar(); if(cur)fbPush(cur); });
addEventListener('offline',syncBar);
setInterval(syncBar,15000);
/* まだ送れていない自分の入力の場所。ここに来た他端末の値は当てない
   （送信までの0.5秒のあいだに相手の更新が届いて、自分の入力が消えるのを防ぐ） */
function diffOps(c){
  const w=toSync(c), curF=flat(w), base=flat(FB.synced[c.id]||{}), ops={}; let n=0;
  for(const k of Object.keys(curF)){ if(META.indexOf(k)>=0)continue;
    if(!eqv(curF[k],base[k])){ ops[k]=curF[k]===undefined?null:curF[k]; n++; } }
  for(const k of Object.keys(base)){ if(META.indexOf(k)>=0)continue;
    if(!(k in curF)){ ops[k]='__DEL__'; n++; } }
  return {w,ops,n};
}
let fbBeat=null, pushTimer=null;
function fbPush(c){
  if(!FB.on||!FB.fs||!c) return;
  const d=diffOps(c);
  if(!d.n){ if(!(FB.dirty&&FB.dirty[c.id]&&FB.dirty[c.id].size)){ FB.pend=false; syncBar(); } return; }
  FB.dirty=FB.dirty||{};
  const set=FB.dirty[c.id]=FB.dirty[c.id]||new Set();
  Object.keys(d.ops).forEach(k=>set.add(k));
  FB.pend=true; syncBar();
  clearTimeout(pushTimer);
  pushTimer=setTimeout(async()=>{
    const fs=FB.fs, ref=fs.doc(FB.db,'anesCases',c.id);
    const d2=diffOps(c); if(!d2.n){ delete FB.dirty[c.id]; FB.pend=false; syncBar(); return; }
    const ops={}; Object.keys(d2.ops).forEach(k=>ops[k]=d2.ops[k]==='__DEL__'?fs.deleteField():d2.ops[k]);
    ops.id=c.id; ops._by=myName()||'—'; ops._at=new Date().toISOString();
    try{ await fs.setDoc(ref,{id:c.id},{merge:true}); await fs.updateDoc(ref,ops);
      FB.synced[c.id]=cln(d2.w); delete FB.dirty[c.id]; FB.at=Date.now(); FB.pend=false; FB.err=''; }
    catch(e){ try{ await fs.setDoc(ref,d2.w,{merge:true});
        FB.synced[c.id]=cln(d2.w); delete FB.dirty[c.id]; FB.at=Date.now(); FB.pend=false; FB.err=''; }
      catch(e2){ FB.pend=true; FB.err=String(e2.message||e2); } }
    syncBar();
  },500);
}

  const a=staffAll();
  openModal(`<h2>スタッフ</h2>
   <p class="muted" style="font-size:12px">従業員名簿（${STAFF_REV} 版）より。執刀には <b>獣医師</b> のみが表示されます。</p>
   <div id="stl" style="max-height:52vh;overflow:auto;margin:10px 0">
     ${a.map((x,i)=>`<div class="drow" style="padding:7px 9px">
       <div class="nm"><b>${esc(x.n)}</b><small>${esc(x.s||'共通')}${x.f?' ・ '+esc(x.f):''}${x.d?' ・ '+esc(x.d):''}</small></div>
       <div class="chips"><button data-i="${i}" data-r="vet" class="${x.r==='vet'?'on':''}">獣医師</button>
         <button data-i="${i}" data-r="ns" class="${x.r==='ns'?'on':''}">看護師</button></div>
       <button class="rm" onclick="delStaff(${i})">×</button></div>`).join('')}
   </div>
   <div class="row">
     <input id="stn" placeholder="名前を追加" style="flex:1">
     <select id="sts" style="width:auto"><option>東京</option><option>名古屋</option><option>共通</option></select>
     <button class="btn primary" onclick="addStaff()">追加</button>
   </div>
   <div class="row" style="margin-top:12px"><button class="btn primary sp" onclick="closeModal();openSettings()">戻る</button></div>`);
  document.getElementById('stl').querySelectorAll('button[data-r]').forEach(b=>b.onclick=()=>{
    const a2=staffAll(); a2[+b.dataset.i].r=b.dataset.r; saveStaff(a2); openStaff(); });
}
function addStaff(){
  const n=document.getElementById('stn').value.trim(); if(!n)return;
  const a=staffAll(); a.push({n,r:'ns',s:document.getElementById('sts').value,own:true}); saveStaff(a); openStaff();
}
function delStaff(i){ const a=staffAll(); a.splice(i,1); saveStaff(a); openStaff(); }

/* ================= モーダル ================= */
function openModal(html){ document.getElementById('mo').innerHTML=html; document.getElementById('mw').classList.add('on'); }
function closeModal(){ document.getElementById('mw').classList.remove('on'); }

/* ---- 初回起動：この端末でやることは名前を選ぶだけ ---- */
function firstRun(){
  if(myName()){
    /* 共用端末は、前の使用から4時間以上あいていたら使用者を確認します */
    const last=+(store.get('lastUse')||0);
    if(isShared()&&(!last||Date.now()-last>4*3600*1000)) switchUser();
    return;
  }
  const needPw=!!cfg('fbCfg')&&!SITE_CONFIG.fbPw;
  openModal(`<h2>はじめの設定</h2>
    <p class="muted" style="font-size:12.5px;margin:0 0 12px">
      この端末で1回だけ設定します。30秒で終わります。</p>
    <label class="f"><span>この端末の使い方</span><div class="chips" id="i_dev">
      <button data-v="personal" class="on">個人の端末</button>
      <button data-v="shared">院内の共用端末</button></div>
      <p class="muted" style="font-size:11.5px;margin:6px 0 0">
        共用を選ぶと、上部に使用者の名前が出て、ワンタップで交代できるようになります。</p></label>
    <label class="f" style="margin-top:12px"><span>拠点</span><div class="chips" id="i_site">
      ${['東京','名古屋'].map(x=>`<button data-v="${x}" class="${siteName()===x?'on':''}">${x}</button>`).join('')}</div></label>
    <div id="i_namewrap" style="margin-top:12px">${staffSel('あなたの名前','me',{me:''},false,'— 選んでください —')}</div>
    ${needPw?`<label class="f" style="margin-top:12px"><span>同期用のパスワード（院内共通・1回だけ）</span>
      <input id="i_pw" type="password" autocomplete="current-password"></label>
      <p class="muted" style="font-size:11.5px;margin:6px 0 0">
        分からない場合は空のままでも始められます。あとで ⚙ から入力できます。</p>`:''}
    <div class="row" style="margin-top:16px">
      <button class="btn primary sp" style="min-height:50px" onclick="firstRunSave()">はじめる</button></div>`);
  const g=document.getElementById('i_site');
  g.querySelectorAll('button').forEach(b2=>b2.onclick=()=>{
    g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b2.classList.add('on'); store.set('site',b2.dataset.v);
    document.getElementById('i_namewrap').innerHTML=staffSel('あなたの名前','me',{me:''},false,'— 選んでください —'); });
  const d=document.getElementById('i_dev');
  d.querySelectorAll('button').forEach(b2=>b2.onclick=()=>{
    d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b2.classList.add('on'); store.set('devMode',b2.dataset.v); });
}
function firstRunSave(){
  const sel=document.querySelector('select[data-staff="me"]');
  const n=sel?sel.value:'';
  if(!n){ toast('名前を選んでください'); return; }
  store.set('myName',n); store.set('lastUse',String(Date.now()));
  const pw=document.getElementById('i_pw');
  if(pw&&pw.value){ store.set('fbPw',pw.value); }
  closeModal(); render();
  if(cfg('fbCfg')) fbConnect(true);
  if(cfg('drugUrl')&&!DRUGREV) fetchDrugDB(true);
  toast(`${n} さん、準備できました`);
}

render(); syncBar();

window.addEventListener('online',()=>setTimeout(checkUpdate,3000));
