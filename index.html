<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="麻酔記録">
<title>QUARC 麻酔記録</title>
<style>
.need{color:var(--warn);font-size:11.5px;font-weight:800}

:root{
  --bg:#eef1f5; --panel:#fff; --line:#dbe2ea; --line2:#eef1f5;
  --ink:#101d2b; --ink2:#5d6c7d; --accent:#0d6e8c; --accent2:#e9f4f8;
  --warn:#c0392b; --ok:#15794a; --amber:#a86a00;
  --hr:#c0392b; --bp:#1f5fb0; --rr:#15794a; --spo2:#7b3fa0; --etco2:#a05a00; --temp:#0d6e8c; --etiso:#8a7400;
  --sys:#1f4e9c; --map:#2e86c1; --dia:#6a9fd4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;overscroll-behavior:none;
  padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
input,select,textarea{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  width:100%;min-height:46px}
textarea{min-height:64px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:14.5px;
  font-weight:700;min-height:46px;cursor:pointer;white-space:nowrap}
.btn:active{background:#eef1f5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;min-height:36px;font-size:13px}
.btn.danger{color:var(--warn);border-color:#e6c3bd}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--ink2)}
.hide{display:none!important}

/* ---------- app bar ---------- */
header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);
  padding:8px 12px;display:flex;gap:10px;align-items:center}
header .ttl{font-weight:800;font-size:16px;letter-spacing:.01em;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{font-size:11.5px;color:var(--ink2);font-weight:600}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:44px;
  font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
main{padding:12px;max-width:1100px;margin:0 auto;padding-bottom:96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.05em;color:var(--accent);
  display:flex;align-items:center;gap:7px}
.card h3::before{content:"";width:4px;height:14px;background:var(--accent);border-radius:2px}
.grid{display:grid;gap:10px}
.grid>*{min-width:0}
.grid .btn{white-space:normal;line-height:1.3}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}}
label.f>span{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;
  font-size:13.5px;font-weight:700;color:var(--ink2);min-height:40px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips.multi button.on{background:var(--ok);border-color:var(--ok)}

/* ---------- status ---------- */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;
  font-size:11.5px;font-weight:800;white-space:nowrap}
.st.plan{background:#eef1f5;color:#5d6c7d}
.st.prep{background:#fff4de;color:var(--amber)}
.st.ready{background:#e3f6ec;color:var(--ok)}
.st.live{background:#fdeae7;color:var(--warn);animation:pl 1.4s ease-in-out infinite}
.st.done{background:#e8eef5;color:#42576b}
@keyframes pl{50%{opacity:.5}}

/* ---------- patient list ---------- */
.plist{display:flex;flex-direction:column;gap:10px}
.pcard{background:#fff;border:1px solid var(--line);border-left:8px solid var(--c,#98a6b4);
  border-radius:13px;padding:11px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pcard .main{flex:1;min-width:150px;cursor:pointer}
.pcard .nm{font-size:18px;font-weight:800;line-height:1.2;color:var(--c,#101d2b)}
.pcard .meta{font-size:12px;font-weight:600;color:var(--ink2);margin-top:3px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pcard .acts{display:flex;gap:6px}
.pcard .acts button{width:44px;height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;
  font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.pcard .acts button:active{background:#eef1f5}
.pcard .acts button.hot{border-color:var(--warn);background:#fdeae7}
.pcard .acts button .dot{position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.empty{text-align:center;color:var(--ink2);padding:34px 12px;font-size:14px}

/* ---------- prep ---------- */
.drow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;
  padding:9px 11px;background:#fff;margin-bottom:8px}
.drow.on{background:#f2fbf6;border-color:#a9dcc2}
.drow .cb{width:34px;height:34px;border:2px solid var(--line);border-radius:9px;flex:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;background:#fff}
.drow.on .cb{background:var(--ok);border-color:var(--ok)}
.drow.on .cb::after{content:"✓"}
.drow .nm{flex:1;min-width:0}
.drow .nm b{font-size:15px;font-weight:800;display:block}
.drow .nm small{font-size:11.5px;color:var(--ink2);font-weight:600}
.drow .vol{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.drow .vol small{font-size:11px;color:var(--ink2)}
.drow .rm{border:0;background:none;color:#b6c0ca;font-size:19px;cursor:pointer;min-width:30px}
/* 薬剤を選ぶ一覧（チェックを入れてまとめて追加） */
.pbox{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fbfaf8;
  max-height:46vh;overflow:auto;padding:4px 7px 7px;-webkit-overflow-scrolling:touch}
.pcat{position:sticky;top:0;z-index:1;background:#fbfaf8;font-size:11.5px;font-weight:800;
  color:var(--accent);padding:8px 3px 5px}
.drow.pk{margin:5px 0;cursor:pointer}
.drow.pk.added{opacity:.5}
.drow.pk.added .cb{border-style:dashed}
.pbar{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}

/* ---------- record ---------- */
.stampbar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.stampbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:5px 2px;
  min-height:50px;cursor:pointer;font-size:11px;font-weight:800;color:var(--ink2);line-height:1.2}
.stampbar button.on{border-color:var(--accent);background:#f2fafc;color:var(--accent)}
.stampbar button b{display:block;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink);margin-top:2px}
.tabs2{display:flex;gap:6px;margin-bottom:10px}
.tabs2 button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;min-height:42px;
  font-size:13.5px;font-weight:800;color:var(--ink2);cursor:pointer}
.tabs2 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vfields{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media(max-width:640px){.vfields{grid-template-columns:repeat(2,1fr)}}
@media(max-width:430px){.card{padding:11px}main{padding:10px}}
.vf{border:1px solid var(--line);border-radius:10px;padding:5px 6px;background:#fff;cursor:pointer;text-align:center}
.vf .k{font-size:10.5px;font-weight:800;color:var(--ink2)}
.vf .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;min-height:25px;line-height:1.25}
.vf .v.e{color:#c3ccd6}
.vsec{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ink2);margin:9px 0 5px}
.vsec:first-child{margin-top:2px}
.vsec b{font-variant-numeric:tabular-nums;background:#eef3f8;border-radius:999px;padding:1px 8px;color:#5c6b7a}
.vsec b.ok{background:#e6f6ed;color:#1c7a46}
.prow{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:9px;background:#fff}
.prow>b{display:block;font-size:13.5px;margin-bottom:6px}
.prow input{width:100%}
.prewarn{border:1px solid #f0c98a;background:#fff8ec;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.stampbar button.off{opacity:.45}
.abx{display:flex;align-items:center;gap:8px;border:1px solid #f0dcae;background:#fff8e6;border-radius:10px;
  padding:7px 9px;margin-top:8px;font-size:12px;font-weight:700;color:var(--amber);flex-wrap:wrap}
.abx.due{border-color:#eccdc8;background:#fdeae7;color:var(--warn);animation:pl 1.2s ease-in-out infinite}
.abx .al-main{flex:1 1 132px;min-width:0;display:flex;flex-direction:column;gap:1px;line-height:1.3}
.abx .al-main small{font-size:11px;font-weight:700;opacity:.72}
.abx .al-t{font-size:14px;font-weight:800;white-space:nowrap}
.abx .btn{min-height:32px;padding:4px 9px;font-size:12px}

/* ---------- vertical chart ---------- */
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.legend button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:800;color:#b6c0ca;min-height:36px;cursor:pointer}
.chartwrap{border:1px solid var(--line);border-radius:12px;background:#fff;
  overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
svg.vchart{display:block;max-width:none}
.charthint{font-size:11.5px;color:var(--ink2);margin:6px 2px 0}

/* ---------- timeline log ---------- */
.log{display:flex;flex-direction:column}
.logrow{display:flex;gap:9px;padding:7px 2px;border-bottom:1px solid var(--line2);font-size:13px;align-items:baseline}
.logrow .t{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink2);min-width:46px}
.logrow .b{flex:1}
.logrow .tag{font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 6px;background:#eef1f5;color:var(--ink2)}
.logrow .tag.ev{background:#e9f4f8;color:var(--accent)}
.logrow .tag.dg{background:#f4ecf9;color:#7b3fa0}
.logrow .x{border:0;background:none;color:#c3ccd6;cursor:pointer;font-size:16px}
.logrow.tap{cursor:pointer;border-radius:8px;min-height:40px;padding:8px 6px;margin:0 -6px}
.logrow.tap:active{background:#f1f5f8}

/* ---------- keypad ---------- */
.kw{position:fixed;inset:0;z-index:200;display:none;background:rgba(10,20,30,.4)}
.kw.on{display:block}
.kp{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);background:#fff;
  border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.kp .t{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:5px;text-align:center}
.kp .v{font-size:32px;font-weight:800;text-align:center;border:2px solid var(--accent);border-radius:12px;
  padding:8px;margin-bottom:10px;min-height:58px;background:#fbfdfe}
.kp .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp .keys button{border:1px solid var(--line);background:#fff;border-radius:11px;font-size:23px;font-weight:800;
  min-height:56px;cursor:pointer}
.kp .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.kp .presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;justify-content:center}

/* ---------- modal ---------- */
.mw{position:fixed;inset:0;z-index:210;display:none;background:rgba(10,20,30,.45);
  align-items:flex-end;justify-content:center}
.mw.on{display:flex}
.mo{background:#fff;border-radius:18px 18px 0 0;width:min(560px,100%);max-height:92vh;overflow:auto;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:640px){.mw{align-items:center}.mo{border-radius:18px}}
.mo h2{margin:0 0 12px;font-size:17px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#101d2b;color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:700;z-index:300;opacity:0;
  transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;
  background:var(--accent);color:#fff;border:0;border-radius:999px;padding:15px 22px;font-size:15px;
  font-weight:800;box-shadow:0 8px 24px rgba(13,110,140,.35);cursor:pointer}
.alertbox{border:1px solid #eccdc8;background:#fdf3f2;border-radius:12px;padding:11px 12px;margin-bottom:12px}
.alertbox .hd{color:var(--warn);font-weight:800;font-size:13px;margin-bottom:8px}
.alertbox .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%;text-align:left;
  background:#fff;border:1px solid #eccdc8;border-radius:9px;padding:8px 10px;margin-top:6px;font-size:12.5px}
.alertbox .ln span{color:var(--ink2);font-size:11.5px}
.alertbox .ln .tg{margin-left:auto;font-weight:800;padding:2px 8px;border-radius:999px}
.alertbox .ln .tg.ng{background:#fdf3f2;color:var(--warn)}
.alertbox .ln .tg.ok{background:#eaf5ef;color:var(--ok)}
.who{display:inline-block;background:#eef4f7;border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:700;color:var(--ink2)}
.warnbox{border:1px solid #f0dcae;background:#fff8e6;color:var(--amber);border-radius:9px;
  padding:9px 11px;font-size:12.5px;font-weight:700}
.drow.lock{opacity:.6}
.drow.lock .cb{border-style:dashed}
.f.req>span::after,.req>.f>span::after{content:' 必須';color:var(--warn);font-size:10.5px;font-weight:800}
.f.req2>span::after{content:' 集計に必要';color:var(--amber);font-size:10.5px;font-weight:800}
.roles{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;
  font-size:12px;font-weight:700;color:var(--ink2)}
.roles b{color:var(--ink)}
.roles button{background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12px;font-weight:700;color:var(--ink2)}
.roles em{font-style:normal;font-weight:600;color:var(--accent);font-size:11px}
.syncbar .whobtn{background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:3px 11px;font-size:12px;font-weight:800;color:var(--ink);flex:0 0 auto}
.syncbar .whobtn.sh{border-color:var(--accent);color:var(--accent)}
.syncbar .whobtn .swap{font-weight:700;font-size:10.5px;opacity:.7}
.shared{display:inline-block;background:#eef4f7;border:1px solid var(--line);border-radius:999px;
  padding:1px 7px;font-size:10px;font-weight:800;color:var(--ink2);vertical-align:1px}
.volbox{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:#f4f7f9;
  border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.volbox b{font-size:20px;letter-spacing:.02em}
.volbox small{font-size:11.5px;color:var(--ink2)}
.repbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#fbfaf8;padding:12px}
.repbox pre,.printonly pre{margin:0;white-space:pre-wrap;word-break:break-word;
  font:13px/1.85 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink)}
.printonly{display:none}
.updbar{position:sticky;top:0;z-index:41;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 14px;font-size:12px;font-weight:700;
  background:#fff6e6;color:#8a5a00;border-bottom:1px solid #f0dcb4}
.updbar button{border:1px solid #8a5a00;background:#8a5a00;color:#fff;border-radius:999px;
  padding:5px 13px;font-size:12px;font-weight:800;min-height:34px;cursor:pointer}
.updbar .later{background:#fff;color:#8a5a00}
.repchart{margin-top:14px}
.repchart h4{margin:0 0 7px;font-size:13px;color:var(--ink2)}
.repchart .chartwrap{overflow:hidden;padding:8px}
.repchart svg.vchart{width:100%;height:auto;max-width:100%}
.syncbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;
  background:#eaf5ef;color:#1c6b45;border-bottom:1px solid #cfe6d9}
.syncbar.off{background:#fdf3f2;color:var(--warn);border-bottom-color:#eccdc8}
.syncbar.pend{background:#fff8e6;color:var(--amber);border-bottom-color:#f0dcae}
.syncbar .dotp{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 8px}
.syncbar .sp{margin-left:auto}
.syncbar em{font-style:normal;font-weight:600;opacity:.85}
@media print{header,.fab,.kw,.mw,.toast,.noprint{display:none!important}body{background:#fff}
  .printonly{display:block}
  #main>*:not(.repcard){display:none!important}
  .repcard{border:0;box-shadow:none;padding:0}
  .printonly pre{font-size:11.5pt;line-height:1.9}
  /* グラフは紙でも一緒に出します。線と文字の指示書なので、拡大しても荒れません */
  .repchart{break-before:page;page-break-before:always;margin-top:0}
  .repchart .chartwrap{border:0;overflow:visible}
  .repchart svg.vchart{width:100%;height:auto}}
</style>
</head>
<body>

<header>
  <button class="iconbtn hide" id="backBtn" onclick="goBack()">←</button>
  <div style="min-width:0;flex:1">
    <div class="ttl" id="hTitle">QUARC 麻酔記録</div>
    <div class="sub" id="hSub"></div>
  </div>
  <button class="iconbtn" id="gearBtn" onclick="openSettings()">⚙</button>
</header>
<div class="syncbar hide" id="syncbar" onclick="openSettings()"></div>
<div class="updbar hide" id="updbar"></div>

<main id="main"></main>
<button class="fab hide" id="fab"></button>

<div class="kw" id="kw" onclick="if(event.target===this)kpClose()">
  <div class="kp">
    <div class="t" id="kpT"></div>
    <div class="v" id="kpV"></div>
    <div class="chips hide" id="kpOpt" style="justify-content:center;margin-bottom:8px"></div>
    <div class="presets" id="kpP"></div>
    <div class="keys">
      <button onclick="kpK('7')">7</button><button onclick="kpK('8')">8</button><button onclick="kpK('9')">9</button>
      <button onclick="kpK('4')">4</button><button onclick="kpK('5')">5</button><button onclick="kpK('6')">6</button>
      <button onclick="kpK('1')">1</button><button onclick="kpK('2')">2</button><button onclick="kpK('3')">3</button>
      <button onclick="kpK('.')">.</button><button onclick="kpK('0')">0</button><button onclick="kpBack()">⌫</button>
    </div>
    <div class="acts">
      <button class="btn" onclick="kpClose()">閉じる</button>
      <button class="btn primary" onclick="kpOK()">確定 ▶ 次へ</button>
    </div>
  </div>
</div>

<div class="mw" id="mw" onclick="if(event.target===this)closeModal()"><div class="mo" id="mo"></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VER='v3.2 (2026-09-24)';   /* 不具合報告のときに一緒に送られます */

/* ══════════════════════════════════════════════════════════════════
   院内設定 — ここだけ書き換えてください（管理者が1回だけ）

   ここに入れておくと、URL を開いた全ての端末が最初から設定済みになります。
   各自の端末でやることは「自分の名前を選ぶ」だけになります。

   ・値は '' （空）のままでも動きます。空の項目はその機能が使えないだけです
   ・各端末の ⚙ から個別に上書きもできます（上書きした端末はそちらが優先）

  if(Number.isInteger(v)) return String(v);

/* 単位の「もと」と、いちばん小さい単位に揃える倍率。
   mg / mcg のほか、バソプレシンの mIU なども扱えるようにしています。
   もと（g / iu / eq …）が違う単位どうしは割り算しません（意味がないため）。 */
function unitInfo(u){
  const m=String(u==null?'':u).trim().match(/^([A-Za-zμµ]+)/);
  const t=(m?m[1]:'').toLowerCase();
  if(t==='mg')   return {b:'g',  f:1000};
  if(t==='mcg'||t==='ug'||t==='μg'||t==='µg') return {b:'g', f:1};
  if(t==='g')    return {b:'g',  f:1000000};
  if(t==='miu'||t==='mu') return {b:'iu', f:1};
  if(t==='iu'||t==='u')   return {b:'iu', f:1000};
  if(t==='meq')  return {b:'eq', f:1};
  if(t==='mmol') return {b:'mol',f:1};
  return {b:t||'?', f:1};
}
const sameUnit=(a,b)=>unitInfo(a).b===unitInfo(b).b;
/* 投与量 ÷ 濃度。単位のもとが違うときは null（＝手入力にします） */
function perConc(dose,dunit,conc,cunit){
  if(dose==null||conc==null||!conc) return null;
  const a=unitInfo(dunit), b=unitInfo(cunit);
  if(a.b!==b.b) return null;
  return (dose*a.f)/(conc*b.f);
}
/* 単位の見出しだけ取り出す（mg/ml → mg、mIU/ml → mIU） */
const unitHead=u=>{const t=String(u||'').split('/')[0].trim();
  return /^(μg|µg|ug)$/i.test(t)?'mcg':t;};

function applyDrugDB(d){
  const got = !!(d&&d.rows&&d.rows.length);
  const rows = got?d.rows:SEED_DB.rows;
  const norm=rows.map(x=>{
    const du=String(x.dunit||'mg/kg');
    return {cat:x.cat||'その他', n:String(x.n||'').trim(),
      conc:(x.conc==null||x.conc===''?null:+x.conc), cunit:x.cunit||'mg/ml',
      dose:(x.dose==null||x.dose===''?null:+x.dose), dunit:du,
      route:x.route||'', dil:x.dil||dilOf(x.n||''), note:x.note||'', warn:x.warn||'',
      cands:Array.isArray(x.cands)?x.cands.map(q=>({v:+q.v,u:String(q.u||du)}))
        .filter(q=>isFinite(q.v)):[],
      cri:(x.cri!==undefined?!!x.cri:/\/(h|hr|min)$/.test(du)),
      per:x.per||(/\/min$/.test(du)?'min':(/\/(h|hr)$/.test(du)?'h':''))};
  }).filter(x=>x.n);
  /* 同じ薬剤名なのに濃度が違う行は取り違えのもとなので、印を付けて別々に並べます */
  const byName={};
  norm.forEach(x=>{ if(x.conc!=null)(byName[x.n]=byName[x.n]||[]).push(x.conc*unitInfo(x.cunit).f); });
  norm.forEach(x=>{
    const a=byName[x.n]||[];
    if(a.length>1&&Math.max(...a)-Math.min(...a)>Math.max(...a)*0.001)
      x.warn=(x.warn?x.warn+' ／ ':'')+'同じ薬剤名で濃度の違う行があります';
    if(x.conc==null) x.warn=(x.warn?x.warn+' ／ ':'')+'濃度が空欄です（mL は手入力になります）';
    else if(x.dose!=null&&!sameUnit(x.cunit,x.dunit))
      x.warn=(x.warn?x.warn+' ／ ':'')+`濃度（${x.cunit}）と投与量（${x.dunit}）の単位が合いません`;
  });
  norm.forEach(x=>{ if(!x.route) x.route=routeGuess(x.n,x.cat,x.cri); });
  const dress=x=>({...x, r:x.route, d:doseTxt(x), ml:mlkgOf(x), dcat:catMap(x.cat),
    abx:/CEZ|ABPC|セファ|アンピシリン/.test(x.n)});
  DRUGDB=norm.filter(x=>!x.cri).map(dress);
  CRIDB =norm.filter(x=> x.cri).map(x=>({...dress(x), r:'CRI'}));
  ALLDRUGS=DRUGDB.concat(CRIDB);
  DRUGREV=got?{rev:d.rev||'',at:d.at||'',n:DRUGDB.length,c:CRIDB.length}:null;
  return got;
}

function perKg(d,w){
  if(d.dose!=null&&d.dose!==''&&d.dunit)
    return `${dnum(d.dose)}${d.dunit.replace(/\/h$/,'/hr')}${
      (d.route==='CRI'&&!/\/(h|hr|min)$/.test(d.dunit))?'/hr':''}`;
  const a=parseFloat(d.amt), m=String(d.pot||'').match(/([\d.]+)\s*(mg|μg|mcg)\/mL/);
  if(!isFinite(a)||!m||!w) return '';
  /* 単位は薬剤側の表記をそのまま使う（0.2mg/kg は 0.2mg/kg のまま書く） */
  let v=a*parseFloat(m[1])/w, u=m[2]==='mg'?'mg':'mcg';
  if(u==='mg'&&v<0.1){v*=1000;u='mcg';}
  if(u==='mcg'&&v>=10000){v/=1000;u='mg';}
  const n=v>=10?Math.round(v):+v.toFixed(v<0.1?3:2);
  return `${n}${u}/kg${d.route==='CRI'?'/hr':''}`;
}

   同じミリ秒に2件作っても衝突しないよう、乱数を付けます
   （同じIDだと片方を削除したときに両方消えてしまうため） */
function newId(){
  return 'C'+Date.now().toString(36).toUpperCase()+'-'
    +Math.random().toString(36).slice(2,6).toUpperCase();
}
/* 投薬・イベント・術後チェック・準備薬の1件ごとに付ける鍵。
   これがあると、離れた端末が同時に追加しても互いの記録が消えません */
let uidN=0;
const uid=()=>Date.now().toString(36)+(uidN=(uidN+1)%1296).toString(36).padStart(2,'0')
  +Math.random().toString(36).slice(2,5);
function blank(){
  return {id:newId(),
    meta:{date:today(),patientName:'',patientId:'',bw:'',species:'犬',breed:'',age:'',sex:'',
          findings:[],comorbid:[],risk:'',procedure:'',dept:'',site:siteName()},
    pre:{}, prep:{items:[],doneAt:''},
    chart:{start:'',anesStart:'',intubation:'',opeStart:'',opeStop:'',anesStop:'',v:{}},
    events:[], doses:[], alerts:[],
    postop:{on:false,interval:30,lastAt:'',rows:[],by:'',stoppedAt:''},
    rep:{tube:'',maint:'',resp:'',circ:'',pain:'',ext:'',post:''},
    createdAt:new Date().toISOString()};
}
function fix(c){
  c.meta=c.meta||{}; c.meta.findings=c.meta.findings||[]; c.meta.comorbid=c.meta.comorbid||[];
  c.pre=c.pre||{};
  c.prep=c.prep||{items:[],doneAt:''}; c.prep.items=c.prep.items||[];
  c.chart=c.chart||{}; c.chart.v=c.chart.v||{};
  c.events=c.events||[]; c.doses=c.doses||[]; c.alerts=c.alerts||[];
  /* 旧版の抗生物質アラームを、新しい通知に移します */
  if(c.abx&&c.abx.lastAt&&c.abx.interval&&!c.alerts.some(a=>a.src==='abx')){
    c.alerts.push({k:uid(),l:'抗生物質の追加',iv:c.abx.interval,rep:true,at:c.abx.lastAt,n:0,on:true,src:'abx'});
  }
  delete c.abx;
  c.postop=Object.assign({on:false,interval:30,lastAt:'',rows:[],by:'',stoppedAt:''},c.postop||{});
  delete c.postop._cycle;   /* 旧版の名残。端末ごとの控え（PO_FIRED）に移しました */
  c.postop.rows=c.postop.rows||[]; if(!c.postop.interval)c.postop.interval=30;
  if(c.postop.by) c.postop.by=staffCanon(c.postop.by);
  c.rep=Object.assign({tube:'',maint:'',resp:'',circ:'',pain:'',ext:'',post:''},c.rep||{});
  /* 旧版のイベントは k に種類が入っていた。k は同期用の鍵、kk が種類、に揃える
     （k が種類のままだと、同じ種類の2件目が同期で消えます。メモが典型） */
  c.events.forEach(e=>{ if(e&&!e.kk&&e.k&&EVKINDS.has(e.k)){ e.kk=e.k; e.k=uid(); } });
  /* 同期用の鍵を全ての行に付ける */
  keyRows(c);
  /* 旧表記の担当者名を正式名に寄せる（川崎→川﨑 など） */
  ['surgeon','assistant','anesthetist','vt','onlineAnes'].forEach(k=>{
    if(c.meta[k]) c.meta[k]=staffCanon(c.meta[k]); });
  if(c.prep.by) c.prep.by=staffCanon(c.prep.by);
  if(c.meta.dept&&DEPTFIX[c.meta.dept]) c.meta.dept=DEPTFIX[c.meta.dept];
  c.doses.forEach(d=>{ if(!d.cat) d.cat=guessCat(d.name,d.t,c); });
  if(c.colorIdx==null){const used={};db.cases.forEach(x=>{if(x!==c&&x.colorIdx!=null)used[x.colorIdx]=(used[x.colorIdx]||0)+1});
    let b=0,bn=1e9;for(let i=0;i<PALETTE.length;i++){const n=used[i]||0;if(n<bn){bn=n;b=i}}c.colorIdx=b;}
  return c;
}
db.cases.forEach(fix);
/* 旧版で同じIDになってしまった症例があれば付け直す */
(function(){ const seen=new Set(); let n=0;
  db.cases.forEach(c=>{ if(!c.id||seen.has(c.id)){ c.id=newId(); n++; } seen.add(c.id); });
  if(n) store.set(KEY,JSON.stringify(db));
})();

/* 状態の自動判定 */
function statusOf(c){
  if(c.chart.anesStop) return {k:'done', l:'終了'};
  if(c.chart.anesStart) return {k:'live', l:'麻酔中'};
  if(c.prep.doneAt)     return {k:'ready',l:'準備完了'};
  if(c.meta.date===today()) return {k:'prep', l:'準備中'};
  return {k:'plan', l:'予定'};
}
const hue=c=>PALETTE[(c.colorIdx||0)%PALETTE.length];
const col=c=>({fg:`hsl(${hue(c)},60%,33%)`,br:`hsl(${hue(c)},58%,50%)`});
const bw=c=>{const v=parseFloat(c.meta.bw);return isFinite(v)&&v>0?v:null};
/* 0.50 → 0.5 のように末尾の0は落とす */

/* 麻酔時間など */
function times(c){
  const t=c.chart;
  return {ind:diff(t.anesStart,t.opeStart), ope:diff(t.opeStart,t.opeStop),
          wake:diff(t.opeStop,t.anesStop), anes:diff(t.anesStart,t.anesStop)};
}
function elapsed(c){ const s=hm2m(c.chart.anesStart); if(s==null)return null;
  if(c.chart.anesStop) return diff(c.chart.anesStart,c.chart.anesStop);
  let d=nowMin()-s; if(d<-720)d+=1440; return Math.max(0,d); }
/* 手術開始からの経過。手術終了を押すまで数え続けます */
function opeElapsed(c){ const s=hm2m(c.chart.opeStart); if(s==null)return null;
  if(c.chart.opeStop) return diff(c.chart.opeStart,c.chart.opeStop);
  let d=nowMin()-s; if(d<-720)d+=1440; return Math.max(0,d); }
function lastVitalMin(c){
  let mx=null; Object.keys(c.chart.v).forEach(t=>{const m=hm2m(t); if(m!=null&&(mx==null||m>mx))mx=m});
  if(mx==null)return null; let d=nowMin()-mx; if(d<-720)d+=1440; return d;
}

/* ================= ルータ ================= */
let view='list', cur=null;
const H=[];
function go(v,c,push=true){ if(push&&view)H.push({v:view,id:cur&&cur.id}); view=v;
  cur=v==='list'?null:(c||cur);   /* リストに戻ったら「開いている症例」は無しにする */
  render(); window.scrollTo(0,0);
  /* 開いている症例を他の端末に知らせる（同時に見ている人を出すため） */
  if(typeof fbBeat==='function') fbBeat(); if(typeof syncBar==='function') syncBar(); }
function goBack(){ const p=H.pop(); if(!p){view='list';cur=null;} else {view=p.v; cur=p.id?db.cases.find(x=>x.id===p.id):null;} render(); }
function render(){
  if(typeof fbBeat==='function'&&fbBeat) fbBeat();
  if(typeof syncBar==='function') syncBar();
  const b=document.getElementById('backBtn'), f=document.getElementById('fab');
  b.classList.toggle('hide',view==='list');
  document.getElementById('gearBtn').classList.toggle('hide',view!=='list');
  f.classList.add('hide');
  const M=document.getElementById('main');
  if(view==='list') return viewList(M);
  if(!cur){ view='list'; return viewList(M); }
  if(view==='detail') return viewDetail(M);
  if(view==='edit')   return viewEdit(M);
  if(view==='prep')   return viewPrep(M);
  if(view==='rec')    return viewRec(M);
  if(view==='postop') return viewPostop(M);
  if(view==='report') return viewReport(M);
}
function head(t,s){ document.getElementById('hTitle').textContent=t; document.getElementById('hSub').textContent=s||''; }

/* ================= ① 患者リスト ================= */
let listFilter='today';
function viewList(M){
  head('麻酔患者リスト', new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'}));
  const f=document.getElementById('fab');
  f.textContent='＋ 新規麻酔'; f.onclick=()=>{const c=fix(blank());db.cases.push(c);save();go('edit',c)};
  f.classList.remove('hide');

  const all=db.cases.slice().sort((a,b)=>{
    const o={live:0,ready:1,prep:2,plan:3,done:4};
    const d=o[statusOf(a).k]-o[statusOf(b).k]; if(d)return d;
    return String(b.meta.date).localeCompare(String(a.meta.date));
  });
  const list=listFilter==='today'?all.filter(c=>c.meta.date===today()||statusOf(c).k==='live'):all;

  const pend=all.filter(needsTally);
  M.innerHTML=`
  ${pend.length?`<div class="alertbox">
    <div class="hd">⚠ 手術集計に未書き出しの症例が ${pend.length} 件あります</div>
    ${pend.slice(0,6).map(c=>{const ms=tallyMissing(c);
      return `<button class="ln" onclick="openReport('${c.id}')">
        <b>${esc(c.meta.patientName||'（無題）')}</b>
        <span>${esc(c.meta.date||'')}${c.meta.procedure?' ・ '+esc(c.meta.procedure):''}</span>
        <span class="tg ${ms.length?'ng':'ok'}">${ms.length?ms.length+'項目 未入力':'書き出せます'}</span></button>`;
    }).join('')}
    ${pend.length>6?`<div class="muted" style="font-size:11.5px;margin-top:4px">ほか ${pend.length-6} 件</div>`:''}
  </div>`:''}
  <div class="row" style="margin-bottom:12px">
    <div class="chips">
      <button class="${listFilter==='today'?'on':''}" onclick="listFilter='today';render()">本日</button>
      <button class="${listFilter==='all'?'on':''}" onclick="listFilter='all';render()">すべて（${all.length}）</button>
    </div>
  </div>
  <div class="plist">${list.length?list.map(pcard).join(''):
    '<div class="empty">本日の麻酔はまだ登録されていません。<br>右下の「＋ 新規麻酔」から登録してください。</div>'}</div>`;
}
function pcard(c){
  const s=statusOf(c), k=col(c), t=times(c), el=elapsed(c), lv=lastVitalMin(c), oel=opeElapsed(c);
  const need=s.k==='live'&&lv!=null&&lv>=6;
  const alDue=alertDueCount(c);
  return `<div class="pcard" style="--c:${k.br}">
    <div class="main" onclick="openCase('${c.id}')">
      <div class="nm">${esc(c.meta.patientName||'（患者名未入力）')}</div>
      <div class="meta">
        <span class="st ${s.k}">${s.l}</span>
        <span>${esc(c.meta.patientId||'ID未入力')}</span>
        <span>${esc(c.meta.bw||'?')}kg</span>
        <span>${esc(c.meta.date||'')}</span>
        ${c.meta.risk?`<span>ASA ${esc(c.meta.risk)}</span>`:''}
        ${s.k==='live'&&el!=null?`<span style="color:var(--warn);font-weight:800">麻酔 ${el}分</span>`:''}
        ${s.k==='live'&&oel!=null&&!c.chart.opeStop?`<span style="color:var(--warn);font-weight:800">手術 ${oel}分</span>`:''}
        ${need?`<span style="color:var(--warn);font-weight:800">未記録 ${lv}分</span>`:''}
        ${alDue?`<span style="color:var(--warn);font-weight:800">🔔 ${alDue}件 時間です</span>`:''}
        ${s.k==='done'&&t.anes!=null?`<span>麻酔 ${t.anes}分</span>`:''}
        ${needsTally(c)?'<span style="color:var(--warn);font-weight:800">集計 未書き出し</span>':''}
        ${c.meta.tallyAt?'<span style="color:var(--ok);font-weight:800">集計済</span>':''}
      </div>
    </div>
    <div class="acts">
      <button title="編集" onclick="openEdit('${c.id}')">✎</button>
      <button title="薬剤準備" onclick="openPrep('${c.id}')" ${c.prep.doneAt?'style="border-color:#a9dcc2;background:#f2fbf6"':''}>💉</button>
      <button title="麻酔記録" class="${s.k==='live'?'hot':''}" onclick="openRec('${c.id}')">📋${need||alDue?'<span class="dot"></span>':''}</button>
      <button title="術後管理" class="${postopDue(c)!=null&&postopDue(c)<=0?'hot':''}" onclick="openPostop('${c.id}')">🩺${postopDue(c)!=null&&postopDue(c)<=0?'<span class="dot"></span>':''}</button>
      <button title="レポート" onclick="openReport('${c.id}')">📄</button>
    </div>
  </div>`;
}
const byId=id=>db.cases.find(x=>x.id===id);
const openCase=id=>go('detail',byId(id));
const openEdit=id=>go('edit',byId(id));
const openPrep=id=>go('prep',byId(id));
const openRec =id=>go('rec', byId(id));
const openPostop=id=>go('postop',byId(id));
const openReport=id=>go('report',byId(id));

/* 削除は患者情報の画面から。何がどれだけ消えるかを見せてから確認します */
function askDelCase(){
  const c=cur, s=statusOf(c);
  const n=Object.keys(c.chart.v).length, ev=c.events.length, ds=c.doses.length, po=c.postop.rows.length;
  openModal(`<h2>症例を削除しますか？</h2>
    <div class="card" style="margin:8px 0;box-shadow:none">
      <div style="font-size:17px;font-weight:800">${esc(c.meta.patientName||'（患者名未入力）')}</div>
      <div class="muted" style="font-size:12.5px;margin-top:4px">
        ${esc(c.meta.patientId||'ID未入力')} ・ ${esc(c.meta.date||'')} ・ ${esc(s.l)}</div>
    </div>
    ${s.k==='live'?'<div class="warnbox" style="margin-bottom:8px">この症例は<b>麻酔中</b>です。本当に削除しますか？</div>':''}
    ${c.meta.tallyAt?'<div class="warnbox" style="margin-bottom:8px">手術集計に書き出し済みです。シート側の行は消えません。</div>':''}
    <p style="font-size:13px;line-height:1.9;margin:0 0 12px">
      次の記録がまとめて消えます。<b>元に戻せません。</b><br>
      バイタル <b>${n}</b> 件 ／ イベント <b>${ev}</b> 件 ／ 投薬 <b>${ds}</b> 件 ／ 術後チェック <b>${po}</b> 件</p>
    <div class="row"><button class="btn sp" onclick="closeModal()">キャンセル</button>
      <button class="btn danger sp" onclick="delCase()">削除する</button></div>`);
}
function delCase(){
  const name=cur.meta.patientName||'症例';
  db.cases=db.cases.filter(x=>x.id!==cur.id); save();
  cur=null; view='list'; H.length=0; closeModal(); render(); toast(`${name} を削除しました`);
}

    <div class="grid g2">
      <label class="f req2"><span>カルテ番号</span><input id="e_pid" value="${esc(c.meta.patientId)}"></label>

    const v=b.dataset.v,i=arr.indexOf(v); if(i<0)arr.push(v); else arr.splice(i,1);
    b.classList.toggle('on',i<0)});
  single('e_sp',v=>c.meta.species=v); single('e_risk',v=>c.meta.risk=v); single('e_dept',v=>c.meta.dept=v);

/* 麻酔記録を始めるのに要る4項目 */
function coreMissing(c){
  const m=c.meta,o=[];
  if(!m.date)o.push('麻酔日'); if(!m.patientName)o.push('患者名');
  if(!bw(c))o.push('体重'); if(!m.anesthetist)o.push('麻酔担当医');
  return o;
}
function saveEdit(){
  const c=cur, g=id=>document.getElementById(id).value.trim();
  c.meta.date=g('e_date')||today(); c.meta.patientId=g('e_pid'); c.meta.patientName=g('e_name');
  c.meta.bw=g('e_bw'); c.meta.procedure=g('e_proc');
  const an=document.querySelector('select[data-staff="anesthetist"]');
  if(an) c.meta.anesthetist=an.value;
  const miss=coreMissing(c);
  if(miss.length){ toast(miss.join('・')+' を入力してください'); return; }
  save(); toast('保存しました'); view='list'; cur=null; H.length=0; render();
}

/* ---- 薬剤を選ぶ一覧 ----
   使う薬にチェックを入れて、最後に1回だけ「追加」を押します。
   選んだ状態は薬剤名と濃度で覚えるので、しぼり込んでも消えません。 */
let prepPick=new Set(), prepQ='';
const pkey=d=>d.n+'|'+(d.conc==null?'':d.conc)+'|'+(d.cri?'CRI':'-');
function prepAddList(c,W){
  const have=new Set((c.prep.items||[]).map(x=>x.name));
  const q=prepQ.trim().toLowerCase();
  let html='', cat=null, n=0;
  ALLDRUGS.forEach(d=>{
    if(q&&((d.n||'')+' '+(d.cat||'')+' '+(d.d||'')).toLowerCase().indexOf(q)<0) return;
    /* CRI はひとまとめに後ろへ並ぶので、見出しにもそう書きます */
    const lab=(d.cat||'その他')+(d.cri&&!/CRI/i.test(d.cat||'')?'（CRI）':'');
    if(lab!==cat){ cat=lab; html+=`<div class="pcat">${esc(lab)}</div>`; }
    n++;
    const k=pkey(d), added=have.has(d.n), on=!added&&prepPick.has(k);
    const ml=d.cri?criRate(d,{v:d.dose,u:d.dunit},W):(d.ml==null?null:W*d.ml);
    html+=`<div class="drow pk ${on?'on':''} ${added?'added':''}" data-k="${esc(k)}"
        onclick="${added?"toast('もう準備リストに入っています')":'prepToggle(this)'}">
      <div class="cb"></div>
      <div class="nm"><b>${esc(d.n)}${d.cri?'（CRI）':''}${
        potency(d)?` <span style="font-size:11.5px;color:var(--ink2);font-weight:700">${esc(potency(d))}</span>`:''}</b>
        <small>${esc(d.d||'')}${d.r?' ・ '+esc(d.r):''}${added?' ・ <b>追加済み</b>':''}${d.warn?' ・ ⚠':''}</small></div>
      <div class="vol">${(W&&ml!=null)?esc(fmt(ml)):'—'}<small> ${d.cri?'mL/hr':'mL'}</small></div>
    </div>`;
  });
  return n?html:'<div class="empty">見つかりません</div>';
}
/* チェックの出し入れ。一覧を作り直すと重いので、その行だけ塗り替えます */
function prepToggle(el){
  const k=el.dataset.k;
  if(prepPick.has(k)) prepPick.delete(k); else prepPick.add(k);
  el.classList.toggle('on',prepPick.has(k));
  prepCount();
}
function prepCount(){
  const b=document.getElementById('p_add'); if(!b) return;
  const n=prepPick.size;
  b.textContent=n?`＋ 選んだ ${n}剤 を追加`:'＋ 選んで追加';
  b.disabled=!n||!cur||!cur.meta.anesthetist;
  const cl=document.getElementById('p_clr'); if(cl) cl.classList.toggle('hide',!n);
}
function prepSearch(v){
  prepQ=v;
  const n=document.getElementById('p_list'); if(!n) return;
  n.innerHTML=prepAddList(cur,bw(cur)); prepCount();
}
/* チェックした薬をまとめて準備リストへ */
function addPicked(){
  if(!cur.meta.anesthetist){ toast('麻酔担当医を設定してください'); return; }
  if(!prepPick.size){ toast('使う薬にチェックを入れてください'); return; }
  const W=bw(cur), have=new Set(cur.prep.items.map(x=>x.name));
  let n=0;
  ALLDRUGS.forEach(d=>{
    if(!prepPick.has(pkey(d))||have.has(d.n)) return;
    have.add(d.n);
    const ml=d.cri?criRate(d,{v:d.dose,u:d.dunit},W):(d.ml==null?null:W*d.ml);
    cur.prep.items.push({k:uid(),name:d.n,dose:d.d,route:d.r||(d.cri?'CRI':''),dil:d.dil,mlkg:d.ml,
      abx:!!d.abx,pot:potency(d),cri:!!d.cri,
      conc:d.conc??null,cunit:d.cunit||'',doseN:d.dose??null,dunit:d.dunit||'',
      vol:(W&&ml!=null)?fmt(ml):'',checked:false,addedBy:cur.meta.anesthetist});
    n++;
  });
  prepPick.clear(); prepQ='';
  save(); render();
  toast(`${n}剤 を準備リストに追加しました`+(W?'':'（体重を入れると mL が出ます）'));
}
/* ================= 薬剤準備のプリセット（院内で共有） =================
   麻酔科医ごとの「いつもの組み合わせ」を名前を付けて保存し、1タップで並べます。
   体重は症例ごとに違うので、mL は呼び出したときに毎回計算し直します。 */
let PRESETS=(()=>{ try{ return JSON.parse(store.get('presets')||'[]') }catch(e){ return [] } })();
const presetSort=a=>a.slice().sort((x,y)=>String(x.name||'').localeCompare(String(y.name||''),'ja'));
function presetSave(){ store.set('presets',JSON.stringify(PRESETS)); }
/* 薬剤1つ分。あとで体重が変わっても計算し直せるように濃度ごと持ちます */
const presetItem=d=>({n:d.name,conc:d.conc??null,cunit:d.cunit||'',
  dose:(d.doseN==null||d.doseN==='')?null:+d.doseN,dunit:d.dunit||'',
  cri:!!d.cri,route:d.route||'',dil:d.dil||''});
/* 準備リストの1行に戻す（いまの体重で mL を計算） */
function presetToPrep(it,W,by){
  const hit=ALLDRUGS.find(x=>x.n===it.n&&(it.conc==null||x.conc===it.conc))||ALLDRUGS.find(x=>x.n===it.n);
  const o=hit?{...hit,dose:(it.dose!=null?it.dose:hit.dose),dunit:it.dunit||hit.dunit}:
    {n:it.n,conc:it.conc,cunit:it.cunit,dose:it.dose,dunit:it.dunit,cri:it.cri,
     route:it.route,dil:it.dil,warn:''};
  const ml=o.cri?criRate(o,{v:o.dose,u:o.dunit},W):(mlkgOf(o)==null?null:W*mlkgOf(o));
  return {k:uid(),name:o.n,dose:doseTxt(o),route:o.route||it.route||(o.cri?'CRI':''),dil:o.dil||'',
    mlkg:mlkgOf(o),abx:!!o.abx,pot:potency(o),cri:!!o.cri,
    vol:(W&&ml!=null)?fmt(ml):'',checked:false,addedBy:by};
}
/* 今のリストに名前を付けて保存 */
function presetNew(){
  if(!cur.prep.items.length){ toast('先に薬剤を追加してください'); return; }
  openModal(`<h2>プリセットに保存</h2>
    <p class="muted" style="font-size:13px">いまの ${cur.prep.items.length} 剤を、名前を付けて院内で共有します。
      呼び出したときは、その症例の体重で mL を計算し直します。</p>
    <label class="f"><span>名前</span><input id="pr_n" placeholder="例) 犬・避妊 / 川﨑" maxlength="24"></label>
    <div class="row" style="margin-top:12px">
      <button class="btn sp" onclick="closeModal()">キャンセル</button>
      <button class="btn primary sp" onclick="presetNewOk()">保存</button></div>`);
  setTimeout(()=>{const n=document.getElementById('pr_n'); if(n)n.focus();},80);
}
function presetNewOk(){
  const nm=document.getElementById('pr_n').value.trim();
  if(!nm){ toast('名前を入れてください'); return; }
  const old=PRESETS.find(p=>p.name===nm);
  if(old&&!confirm(`「${nm}」はすでにあります。上書きしますか？`)) return;
  const p={id:old?old.id:uid(),name:nm,by:myName()||'',at:new Date().toISOString(),
    items:cur.prep.items.map(d=>presetItem(d))};
  PRESETS=presetSort([...PRESETS.filter(x=>x.id!==p.id),p]);
  presetSave(); presetPush(p); closeModal(); render();
  toast(`「${nm}」を保存しました（${p.items.length}剤）`);
}
/* 呼び出し。すでに入っている薬は重ねません */
function presetApply(id){
  const p=PRESETS.find(x=>x.id===id); if(!p) return;
  if(!cur.meta.anesthetist){ toast('麻酔担当医を設定してください'); return; }
  const W=bw(cur), have=new Set(cur.prep.items.map(x=>x.name));
  const add=p.items.filter(it=>!have.has(it.n));
  if(!add.length){ toast('すべて入っています'); return; }
  add.forEach(it=>cur.prep.items.push(presetToPrep(it,W,cur.meta.anesthetist)));
  save(); render();
  toast(`${esc(p.name)} から ${add.length}剤 を追加しました`+(W?'':'（体重を入れると mL が出ます）'));
}
/* 名前を変える・消す */
function presetEdit(){
  openModal(`<h2>プリセット</h2>
    ${PRESETS.length?`<div style="max-height:52vh;overflow:auto;margin:8px 0">
      ${PRESETS.map(p=>`<div class="drow" style="padding:7px 9px">
        <div class="nm"><b>${esc(p.name)}</b><small>${p.items.length}剤${p.by?' ・ '+esc(p.by):''}</small></div>
        <button class="btn sm" onclick="presetRename('${p.id}')">名前</button>
        <button class="rm" onclick="presetRemove('${p.id}')">×</button></div>`).join('')}
    </div>`:'<div class="empty">まだありません。準備リストを作って「プリセットに保存」を押してください。</div>'}
    <p class="muted" style="font-size:12px">プリセットは院内で共有されます（作った人の名前が残ります）。</p>
    <div class="row" style="margin-top:10px"><button class="btn primary sp" onclick="closeModal()">閉じる</button></div>`);
}
function presetRename(id){
  const p=PRESETS.find(x=>x.id===id); if(!p)return;
  const nm=prompt('新しい名前',p.name); if(nm==null)return;
  const v=nm.trim(); if(!v)return;
  p.name=v; p.at=new Date().toISOString();
  PRESETS=presetSort(PRESETS); presetSave(); presetPush(p); presetEdit(); render();
}
function presetRemove(id){
  const p=PRESETS.find(x=>x.id===id); if(!p)return;
  if(!confirm(`「${p.name}」を消しますか？（院内の全員から消えます）`))return;
  PRESETS=PRESETS.filter(x=>x.id!==id); presetSave(); presetDel(id); presetEdit(); render();
  toast(`「${p.name}」を消しました`);
}
/* 準備画面に出す帯 */
function presetBar(c){
  return `<div class="row" style="gap:6px;flex-wrap:wrap">
    ${PRESETS.map(p=>`<button class="btn sm" onclick="presetApply('${p.id}')" title="${esc(p.by||'')}">
      ${esc(p.name)}<span class="muted" style="font-weight:700"> ${p.items.length}剤</span></button>`).join('')}

    ${PRESETS.length?'<button class="btn sm" onclick="presetEdit()">整理</button>':''}

}

/* チェックには準備する人の選択が要ります。誰が確認したかも残します */
function toggleDrug(i){

/* --- 投薬 ---
   薬剤（力価つき）を選び、投与量を mg/kg で選ぶ。mL は体重から自動計算します。 */
function parsePot(s){ const m=String(s||'').match(/([\d.]+)\s*([A-Za-zμµ]+)\s*\/\s*mL/i);
  return m?{v:parseFloat(m[1]),u:unitHead(m[2])}:null; }
function parseDose(s){ const m=String(s||'').match(/([\d.]+)\s*(mg|μg|mcg)\s*\/\s*kg\s*(\/\s*(?:h|hr|min))?/i);
  return m?{v:parseFloat(m[1]),u:(/mg/i.test(m[2])?'mg':'mcg')+'/kg'+(m[3]?m[3].replace(/\s/g,'').replace('/hr','/h'):'')}:null; }
/* mL ＝ 投与量 × 体重 ÷ 濃度。これが唯一の計算式です */
function volCalc(conc,cunit,dose,w){
  if(!w||!dose) return null;
  const r=perConc(dose.v,dose.u,conc,cunit);
  return r==null?null:r*w;
}
/* CRI の mL/hr。/min の指示は 60倍して1時間あたりに直します */
function criRate(o,dose,w){
  if(!o||!dose||!w) return null;
  const r=perConc(dose.v,dose.u,o.conc,o.cunit);
  return r==null?null:r*(/\/min$/.test(dose.u)?60:1)*w;
}
/* 薬剤名＋濃度でまとめ、その薬で選べる投与量を並べます。
   同じ名前でも濃度が違えば別の行にします（取り違えを防ぐため） */
function drugGroups(c){
  const g=new Map();
  const key=o=>o.n+'|'+(o.conc==null?'-':o.conc*unitInfo(o.cunit).f+unitInfo(o.cunit).b)+(o.cri?'|cri':'');
  const add=o=>{
    if(!o.n) return;
    const k=key(o), first=!g.has(k);
    if(first) g.set(k,{n:o.n,cat:o.cat,dcat:o.dcat,conc:o.conc,cunit:o.cunit,cri:!!o.cri,
      du:o.dunit||'',per:o.per||'',dil:o.dil||'',warn:o.warn||'',
      r:o.route||(o.cri?'CRI':''),doses:[]});
    const q=g.get(k);
    if(!q.r&&o.route) q.r=o.route;
    if(!q.dil&&o.dil) q.dil=o.dil;
    /* シートの「投与量」と「投与量候補」列の値を、そのまま選択肢に並べます */
    const put=(v,u)=>{
      if(v==null||!isFinite(v)) return;
      const uu=u||o.dunit||q.du, txt=dnum(v)+' '+uu;
      if(!q.doses.some(d=>d.txt===txt))
        q.doses.push({txt,v,u:uu,cat:o.dcat||catMap(o.cat),r:o.route||q.r});
    };
    put(o.dose,o.dunit);
    /* 並べ替えはしません。先頭（シートの「投与量」）が初めから選ばれているためです */
    (o.cands||[]).forEach(cd=>put(cd.v,cd.u));
  };
  ALLDRUGS.forEach(add);
  /* 一覧にない薬を準備リストに足していたときは、そのまま選べるようにします */
  const names=new Set([...g.values()].map(x=>x.n));
  c.prep.items.forEach(p=>{
    if(!p.name||names.has(p.name)) return;
    names.add(p.name);
    const pd=parseDose(p.dose), pt=parsePot(p.pot);
    g.set(p.name+'|prep',{n:p.name,cat:'',dcat:'',conc:pt?pt.v:null,cunit:pt?pt.u+'/ml':'',
      cri:String(p.route||'')==='CRI',per:'',dil:p.dil||'',warn:'',
      r:String(p.route||'').split('/')[0],
      doses:pd?[{txt:p.dose,v:pd.v,u:pd.u,cat:'',r:p.route}]:[]});
  });
  /* 準備した薬を先頭に。あとはシートの並び（分類ごと）のまま */
  const prepped=new Set(c.prep.items.map(p=>p.name));
  const out=[...g.values()];
  out.forEach((o,i)=>{ o._i=i; o._p=prepped.has(o.n); });
  return out.sort((a,b)=>(b._p?1:0)-(a._p?1:0)||a._i-b._i);
}

    const lab=o._p?'準備した薬':(o.cat||'その他');
    if(lab!==cur){ if(cur!==null)html+='</optgroup>'; html+=`<optgroup label="${esc(lab)}">`; cur=lab; }

    html+=`<option value="${i}"${gkey(o)===doseKey?' selected':''}>${esc(o.n)}${o.cri?'（CRI）':''}${
      potency(o)?'　'+esc(potency(o)):''}${o.warn?'　⚠':''}</option>`;
  });
  if(!n) return '<option value="">（見つかりません）</option>';
  return html+(cur===null?'':'</optgroup>');
}

/* ---- 入力中の状態 ----
   画面は30秒ごとに描き直され、遠隔から記録が届いたときにも描き直されます。
   そのたびに選択が消えて先頭の薬（アトロピン）に戻っていたので、
   選んでいる薬・投与量・実投与量を覚えておいて、描き直しのあとに戻します。 */
let doseKey='', doseIdx='', doseCust='', doseUnit='', doseAmt='', doseQ='';
const gkey=o=>o?o.n+'|'+(o.conc==null?'-':o.conc)+(o.cri?'|cri':''):'';
const curGroup=()=>doseGroups[+((document.getElementById('d_name')||{}).value||0)];
/* 描き直しのあとに呼びます。薬が変わっていなければ、入力中の内容をそのまま戻します */
function doseRestore(){
  const sel=document.getElementById('d_name'); if(!sel) return;
  const o=curGroup();
  if(!o||gkey(o)!==doseKey){ onDrugPick(); return; }
  const s=document.getElementById('d_dose');
  s.innerHTML=o.doses.map((d,i)=>`<option value="${i}">${esc(d.txt)}</option>`).join('')
    +'<option value="x">その他（数値を入力）</option>';
  s.value=(doseIdx==='x'||(doseIdx!==''&&+doseIdx<o.doses.length))?doseIdx:(o.doses.length?'0':'x');
  doseIdx=s.value;
  const u=document.getElementById('d_unit');
  if(u){ u.innerHTML=unitChoices(o).map(x=>`<option>${x}</option>`).join('');
         if(doseUnit&&[...u.options].some(x=>x.value===doseUnit)) u.value=doseUnit; }
  const cu=document.getElementById('d_cust'); if(cu) cu.value=doseCust;
  document.getElementById('d_cwrap').classList.toggle('hide',s.value!=='x');
  setRoute(doseRoute); setCat(doseCat);
  calcVol();
  /* 丸めて入れた量は、計算値より優先します */
  const amt=document.getElementById('d_amt');
  if(amt&&doseAmt!=='') amt.value=doseAmt;
}
/* 薬剤名でしぼり込む。選んでいた薬が残っていれば選択は保たれます */
function doseSearch(v){
  doseQ=v;
  const s=document.getElementById('d_name'); if(!s) return;
  s.innerHTML=doseOptions(doseGroups);
  doseRestore();
}
/* CRI は mcg/kg/hr のような速度、それ以外は mg/kg で入れます */
function unitChoices(o){
  const a=(o&&o.cri)?['mcg/kg/h','mcg/kg/min','mg/kg/h','mg/kg/min']:['mg/kg','mcg/kg'];
  /* シートでその薬に使われている単位を先頭にします（mIU など一覧にないものは足します） */
  const u=(o&&((o.doses[0]&&o.doses[0].u)||o.du))||'';
  const i=a.indexOf(u);
  if(i>0) a.unshift(a.splice(i,1)[0]);
  else if(i<0&&u) a.unshift(u);
  /* 濃度と単位のもとが合わないものは、計算できないので出しません */
  return o&&o.conc!=null?a.filter(x=>sameUnit(x,o.cunit)||x===u):a;
}
function onDrugPick(){
  const o=curGroup(); if(!o)return;
  /* 薬を選び直したので、投与量・実投与量は入れ直しになります */
  doseKey=gkey(o); doseIdx=''; doseCust=''; doseUnit=''; doseAmt='';
  const s=document.getElementById('d_dose');
  s.innerHTML=o.doses.map((d,i)=>`<option value="${i}">${esc(d.txt)}</option>`).join('')
    +'<option value="x">その他（数値を入力）</option>';
  if(!o.doses.length) s.value='x';
  const u=document.getElementById('d_unit');
  if(u) u.innerHTML=unitChoices(o).map(x=>`<option>${x}</option>`).join('');
  setRoute(o.r||(o.cri?'CRI':''));
  onDosePick();
}
function onDosePick(){
  const o=curGroup(), s=document.getElementById('d_dose');
  doseIdx=s?s.value:''; doseAmt='';
  const custom=s.value==='x';
  document.getElementById('d_cwrap').classList.toggle('hide',!custom);
  const d=custom?null:(o&&o.doses[+s.value]);
  if(d&&d.r) setRoute(d.r);
  applyCat(d);
  calcVol();
}
/* 報告書の分類は、シートの分類をそのまま使います（一覧にない薬だけ推測） */
function applyCat(d){
  const o=curGroup();
  const t=(document.getElementById('d_t')||{}).value||recTime;
  setCat((d&&d.cat)||(o&&o.dcat)||guessCat(o?o.n:'',t,cur));
}
/* 選んだ投与量。「その他」のときは入力欄の数値を使います */
function selDose(){
  const o=curGroup(), s=document.getElementById('d_dose'); if(!o||!s) return null;
  if(s.value==='x'){
    const v=parseFloat(document.getElementById('d_cust').value);
    if(!isFinite(v)) return null;
    return {dose:{v,u:document.getElementById('d_unit').value},mlkg:null};
  }
  const d=o.doses[+s.value]; if(!d) return null;
  return {dose:{v:d.v,u:d.u},mlkg:null,txt:d.txt,cat:d.cat};
}
function calcVol(){
  const o=curGroup(), sd=selDose(), w=bw(cur), box=document.getElementById('d_vol');
  if(!box) return;
  /* 「その他」の数値と単位も覚えておきます（描き直しで消えないように） */
  const c0=document.getElementById('d_cust'); if(c0) doseCust=c0.value;
  const u0=document.getElementById('d_unit'); if(u0) doseUnit=u0.value;
  const amt=document.getElementById('d_amt'), lab=document.getElementById('d_amtu');
  const dose=sd&&sd.dose;
  const dTxt=dose?`${dnum(dose.v)}${dose.u.replace(/\/h$/,'/hr')}`:'—';
  const extra=()=>{
    if(o&&o.dil) box.innerHTML+=`<small style="flex-basis:100%">${esc(o.dil)}</small>`;
    if(o&&o.warn) box.innerHTML+=`<small style="flex-basis:100%;color:var(--warn)">⚠ ${esc(o.warn)}</small>`;
  };
  /* CRI は mL/hr で出します */
  if(o&&o.cri){
    const rate=criRate(o,dose,w);
    if(lab) lab.textContent='mL/hr';
    if(rate!=null){ amt.value=fmt(rate); amt.placeholder=fmt(rate); } else { amt.value=''; amt.placeholder='mL/hr'; }
    box.innerHTML = !w ? '<b style="color:var(--warn)">体重が未入力です</b>'
      : rate!=null ? `<b>${fmt(rate)} mL/hr</b><small>${esc(o.n)} ${dTxt} × ${w}kg ÷ ${esc(potency(o))}${
          /\/min$/.test(dose.u)?'（×60分）':''}</small>`
      : !o.conc ? `<b>—</b><small>濃度が分からないため mL/hr は手入力してください</small>`
      : `<b>—</b><small>投与速度を入れてください</small>`;
    extra(); return;
  }
  if(lab) lab.textContent='mL';
  const ml=volCalc(o&&o.conc,o&&o.cunit,dose,w);
  if(ml!=null){ amt.value=fmt(ml); amt.placeholder=fmt(ml); } else { amt.value=''; amt.placeholder='mL'; }
  box.innerHTML = !w ? '<b style="color:var(--warn)">体重が未入力です</b>'
   : ml!=null ? `<b>${fmt(ml)} mL</b><small>${esc(o.n)} ${dTxt} × ${w}kg ÷ ${esc(potency(o))}</small>`
   : !(o&&o.conc) ? `<b>—</b><small>濃度が分からないため mL は手入力してください</small>`
   : `<b>—</b><small>投与量を入れてください</small>`;
  extra();
}
function onTimePick(){ if(!curGroup())return;
  const s=document.getElementById('d_dose');
  applyCat(s&&s.value!=='x'?curGroup().doses[+s.value]:null); }
function setRoute(r){ doseRoute=r;
  const n=document.getElementById('d_route'); if(!n)return;
  n.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===r));
  const w=document.getElementById('d_rneed'); if(w) w.classList.toggle('hide',!!r);
  calcVol(); }
function setCat(x){ doseCat=x;
  const n=document.getElementById('d_cat'); if(!n)return;
  n.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===x)); }
function addDose(){
  const o=curGroup()||{n:'',conc:null}, sd=selDose(), po=doseInto==='postop';
  const a=document.getElementById('d_amt').value.trim();
  const t=document.getElementById('d_t').value||(po?poTime:recTime);
  if(!sd){ toast('投与量を選んでください'); return; }
  if(!a){ toast(o.cri?'mL/hr を入力してください':'mL を入力してください'); return; }
  /* 報告書に「iv」「im」を書くために経路は必ず残します（シートの投与経路の列を埋めれば自動で入ります） */
  if(!doseRoute&&!o.cri){ toast('投与経路を選んでください'); return; }
  const nm=o.n;
  cur.doses.push({k:uid(),t,name:nm,pot:potency(o),amt:a,unit:o.cri?'mL/hr':'mL',
    route:o.cri?'CRI':(doseRoute||o.r||''),
    dose:sd.dose?+sd.dose.v:null, dunit:sd.dose?sd.dose.u:'',
    cat:doseCat||guessCat(nm,t,cur),
    by:(po?(cur.postop.by||myName()):myName())||'',
    ...(o.dil?{dil:o.dil}:{}),
    ...(po?{po:true}:{})});
  /* 麻酔担当医と実施者が違う＝指示のもとでの投与。指示者も残す */
  const last=cur.doses[cur.doses.length-1];
  if(last.by&&cur.meta.anesthetist&&last.by!==cur.meta.anesthetist) last.ord=cur.meta.anesthetist;
  const d=ALLDRUGS.find(x=>x.n===o.n);
  if(d&&d.abx){ const ek=uid(); cur.events.push({k:ek,t,kk:'abx',l:'抗生物質投与'}); askAbx(t,ek); }
  doseAmt='';   /* 次の記録は、また計算値から始めます */
  save(); render(); toast(`${o.n} ${a} mL ${doseRoute||''} を ${t} で記録`);
}

/* ================= 通知（リマインダー） =================
   抗生物質の追加投与のように「○分おき」、体位変換のように「○分後に1回」の
   どちらも設定できます。麻酔記録の画面に帯で出て、時間になると端末が通知します。 */
const ALERT_PRESETS=['バイタル記録','SpO2クリップの位置を変える','抗生物質の追加','血液ガス測定','ACT測定',
  '体位変換','眼軟膏','カフ圧の確認','保温の確認','尿量の確認','輸液量の確認'];
const ALERT_IVS=[5,10,15,30,45,60,90,120];
/* よく使う通知は、1タップで置けるようにします */
const ALERT_QUICK=[
  {l:'バイタル記録',              iv:5,  rep:true},
  {l:'SpO2クリップの位置を変える', iv:60, rep:true}
];
function alertQuick(i){
  askNotify();
  const q=ALERT_QUICK[i]; if(!q||!cur) return;
  const c=cur, had=(c.alerts||[]).find(a=>a.l===q.l);
  if(had){ had.at=nowHM(); had.n=0; had.on=true; delete ALERT_FIRED[c.id+'|'+had.k];
    save(); render(); toast(`${q.l}：${had.at} から ${had.iv}分おき`); return; }
  c.alerts.push({k:uid(),l:q.l,iv:q.iv,rep:q.rep,at:nowHM(),n:0,on:true});
  save(); render(); toast(`${q.l}：${q.iv}分おきで置きました`);
}
/* 通知を出したかどうかは端末ごとに覚えます（同期で往復させないため） */
const ALERT_FIRED={};
const alertsOf=c=>(c.alerts||[]).filter(a=>a&&a.on!==false&&a.iv>0);
/* 基準時刻からの経過（分）。日をまたいだ入力を誤判定しないよう補正します */
function alertEl(a){ const t=hm2m(a.at); if(t==null||!a.iv) return null;
  let el=nowMin()-t; if(el<-720)el+=1440; return el; }
/* いまの状態。cy は「何回分すぎたか」 */
function alertState(a){
  const el=alertEl(a); if(el==null) return null;
  if(a.rep){
    const cy=Math.floor(el/a.iv);
    if(cy>=1&&(a.n||0)<cy) return {due:true,over:el-cy*a.iv,cy,el};
    return {due:false,left:(cy+1)*a.iv-el,cy,el};
  }
  if(el>=a.iv) return {due:true,over:el-a.iv,cy:1,el};
  return {due:false,left:a.iv-el,cy:0,el};
}
/* 予定より12時間すぎたものは、鳴りっぱなしを避けるため止めます */
const alertStale=a=>{ const el=alertEl(a); return el!=null&&el>720; };
function alertBanners(c){
  const list=alertsOf(c).filter(a=>!alertStale(a));
  if(!list.length) return '';
  const st=a=>alertState(a)||{};
  list.sort((x,y)=>{const a=st(x),b=st(y);
    return (b.due?1:0)-(a.due?1:0)||((a.left??-a.over)-(b.left??-b.over));});
  return list.map(a=>{ const s=st(a);
    return `<div class="abx ${s.due?'due':''}">
      <div class="al-main"><b>🔔 ${esc(a.l)}</b>
        <small>${a.rep?`${a.iv}分おき`:`${a.iv}分後`}${a.at?` ／ 起点 ${esc(a.at)}`:''}</small></div>
      <span class="al-t">${s.due?(s.over>0?`${s.over}分 超過`:'時間です'):`あと ${s.left} 分`}</span>
      <button class="btn ${s.due?'primary':''}" onclick="alertDone('${a.k}')" title="いま実施した">済</button>
      <button class="btn" onclick="alertEdit('${a.k}')" title="変える">⏰</button>
      <button class="btn" onclick="alertStop('${a.k}')" title="やめる">×</button></div>`;
  }).join('');
}
/* 患者リストに出す「時間です」の数 */
function alertDueCount(c){
  return alertsOf(c).filter(a=>!alertStale(a)&&(alertState(a)||{}).due).length;
}
/* 済＝いま実施した。ここから数え直します（1回だけのものは消えます） */
function alertDone(k){
  const c=cur, a=(c.alerts||[]).find(x=>x.k===k); if(!a) return;
  if(!a.rep){ c.alerts=c.alerts.filter(x=>x.k!==k); save(); render(); toast(`${a.l} を消しました`); return; }
  a.at=nowHM(); a.n=0; delete ALERT_FIRED[c.id+'|'+k];
  save(); render(); toast(`${a.l}：${a.at} から ${a.iv}分おき`);
}
function alertStop(k){
  const c=cur, a=(c.alerts||[]).find(x=>x.k===k); if(!a) return;
  if(!confirm(`「${a.l}」の通知をやめますか？`)) return;
  c.alerts=c.alerts.filter(x=>x.k!==k); delete ALERT_FIRED[c.id+'|'+k];
  save(); render(); toast(`${a.l} の通知をやめました`);
}
/* 追加・変更の画面 */
let alertDraft=null;
function alertEdit(k){
  const c=cur, a=k?(c.alerts||[]).find(x=>x.k===k):null;
  alertDraft=a?{...a}:{k:'',l:'',iv:60,rep:true,at:nowHM(),n:0,on:true};
  alertForm();
}
function alertForm(){
  const d=alertDraft;
  openModal(`<h2>${d.k?'通知を変える':'通知を追加'}</h2>
    <label class="f"><span>内容</span>
      <input id="al_l" value="${esc(d.l)}" placeholder="例) 抗生物質の追加" maxlength="20" oninput="alertDraft.l=this.value"></label>
    <div class="chips" id="al_p" style="margin:7px 0 12px">
      ${ALERT_PRESETS.map(x=>`<button data-v="${esc(x)}" class="${d.l===x?'on':''}">${esc(x)}</button>`).join('')}</div>
    <label class="f"><span>間隔（分）</span>
      <input id="al_iv" inputmode="numeric" value="${d.iv}"
        style="font-size:20px;font-weight:800;text-align:center;min-height:48px" oninput="alertIv(this.value)"></label>
    <div class="chips" id="al_ivp" style="margin:7px 0 12px">
      ${ALERT_IVS.map(v=>`<button data-v="${v}" class="${d.iv==v?'on':''}">${v}分</button>`).join('')}</div>
    <div class="chips" id="al_rep" style="margin-bottom:12px">
      <button data-v="1" class="${d.rep?'on':''}">${d.iv}分おきに繰り返す</button>
      <button data-v="0" class="${d.rep?'':'on'}">${d.iv}分後に1回だけ</button></div>
    <label class="f"><span>起点の時刻</span>
      <div class="row"><input type="time" id="al_at" value="${esc(d.at)}" style="flex:1" onchange="alertDraft.at=this.value">
      <button class="btn sm" onclick="alertDraft.at=nowHM();alertForm()">今</button></div></label>
    <p class="muted" style="font-size:12px;margin:8px 0 0">
      ${d.rep?`起点から <b>${d.iv}分</b> ごとに通知します。「済」を押すとその時刻から数え直します。`
             :`起点から <b>${d.iv}分</b> 後に1回だけ通知します。`}</p>
    <div class="row" style="margin-top:12px">
      <button class="btn sp" onclick="closeModal()">キャンセル</button>
      <button class="btn primary sp" onclick="alertSave()">${d.k?'変更する':'この通知を入れる'}</button></div>`);
  document.getElementById('al_p').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    alertDraft.l=b.dataset.v; alertForm(); });
  document.getElementById('al_ivp').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    alertDraft.iv=+b.dataset.v; alertForm(); });
  document.getElementById('al_rep').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    alertDraft.rep=b.dataset.v==='1'; alertForm(); });
}
function alertIv(v){
  const n=Math.max(1,Math.min(720,Math.round(+v||0)));
  alertDraft.iv=n;
  document.getElementById('al_ivp').querySelectorAll('button')
    .forEach(b=>b.classList.toggle('on',+b.dataset.v===n));
}
function alertSave(){
  askNotify();   /* この端末でも鳴るように、許可を確かめます */
  const c=cur, d=alertDraft;
  d.l=(document.getElementById('al_l').value||'').trim();
  d.at=document.getElementById('al_at').value||nowHM();
  d.iv=Math.max(1,Math.min(720,Math.round(+document.getElementById('al_iv').value||0)));
  if(!d.l){ toast('内容を入れてください'); return; }
  c.alerts=c.alerts||[];
  if(d.k){ const a=c.alerts.find(x=>x.k===d.k); Object.assign(a,d); delete ALERT_FIRED[c.id+'|'+d.k]; }
  else { d.k=uid(); d.on=true; d.n=0; c.alerts.push(d); }
  askNotify();
  save(); closeModal(); render();
  toast(`${d.l}：${d.at} から ${d.iv}分${d.rep?'おき':'後'}`);
}
/* 通知の許可（初回だけ聞かれます） */
function askNotify(){
  try{ if('Notification' in window&&Notification.permission==='default') Notification.requestPermission(); }catch(e){}
}
/* 術後チェックの通知を「もう出したか」は端末ごとに覚えます。
   症例に書いてしまうと同期で相手にも伝わり、iPad で鳴ると iPhone では鳴らなくなります。 */
const PO_FIRED={};
/* 設定画面から押したとき。拒否されている場合は端末の設定が要ることを伝えます */
function askNotifyNow(){
  if(!('Notification' in window)){ toast('この端末は通知に対応していません'); return; }
  if(Notification.permission==='granted'){
    try{ new Notification('QUARC 麻酔記録',{body:'通知は届いています'}); }catch(e){}
    toast('この端末では通知が許可されています'); return; }
  if(Notification.permission==='denied'){
    toast('拒否されています。iOS は 設定 → 通知 から許可してください'); return; }
  try{ Notification.requestPermission().then(r=>{
    toast(r==='granted'?'通知を許可しました':'許可されませんでした');
    closeModal(); openSettings(); }); }catch(e){}
}
/* 抗生物質を記録したときは、この画面を出して間隔を決めてもらいます */
function askAbx(t,ev){
  const c=cur, a=(c.alerts||[]).find(x=>x.src==='abx');
  if(a){ a.at=t||nowHM(); a.n=0; if(ev) a.ev=ev; delete ALERT_FIRED[c.id+'|'+a.k];
    save(); render(); toast(`抗生物質：${a.at} から ${a.iv}分おき`); return; }
  alertDraft={k:'',l:'抗生物質の追加',iv:90,rep:true,at:t||nowHM(),n:0,on:true,src:'abx',ev:ev||''};
  alertForm();
}

setInterval(()=>{
  db.cases.forEach(c=>{
    /* 終了を押すまで、設定した間隔で繰り返し通知します */
    const cy=postopCycle(c);
    if(cy!=null&&cy>=1&&PO_FIRED[c.id]!==cy){
      PO_FIRED[c.id]=cy;
      const msg=`${c.meta.patientName}：術後バイタルチェックの時間です`
        +(cy>1?`（${(cy-1)*c.postop.interval}分 超過）`:'');
      try{ if('Notification' in window&&Notification.permission==='granted') new Notification('QUARC 麻酔記録',{body:msg}); }catch(e){}
      toast(msg);
    }
    /* 設定した通知。繰り返しは回が変わるたびに1度ずつ鳴らします */
    alertsOf(c).forEach(a=>{
      if(alertStale(a)) return;
      const st=alertState(a); if(!st||!st.due) return;
      const key=c.id+'|'+a.k;
      if(ALERT_FIRED[key]===st.cy) return;
      ALERT_FIRED[key]=st.cy;
      const msg=`${c.meta.patientName}：${a.l} の時間です`+(st.over>0?`（${st.over}分 超過）`:'');
      try{ if('Notification' in window&&Notification.permission==='granted') new Notification('QUARC 麻酔記録',{body:msg}); }catch(e){}
      toast(msg);
    });
  });
  if(view==='rec'||view==='list'||view==='postop') render();
},30000);

/* --- 縦型グラフ --- */
let plotOff=JSON.parse(store.get('plotOff2')||'[]');
const plotOn=k=>!plotOff.includes(k);
function togglePlot(k){ const i=plotOff.indexOf(k); i<0?plotOff.push(k):plotOff.splice(i,1);
  store.set('plotOff2',JSON.stringify(plotOff)); render(); }
/* 全体を1画面に収めるか、横になぞって細かく見るか */
let chartZoom=store.get('chartZoom')||'fit';
function setZoom(z){ chartZoom=z; store.set('chartZoom',z); render(); }
/* ===== 麻酔記録グラフ =====
   横軸が時間。項目ごとに帯（パネル）を分けて、それぞれ専用の目盛りで描きます。
   これで HR と SpO2 と体温が同じ線の上で重なることがなくなります。
   麻酔器・輸液・CRI は、値が変わったところだけを段で示します（上段の表）。 */
const VCOL={hr:'#c0392b',sys:'#1f4e9c',map:'#2e86c1',dia:'#6a9fd4',
  rr:'#15794a',spo2:'#7b3fa0',etco2:'#a05a00',temp:'#0d6e8c',etiso:'#8a7400',pi:'#7b3fa0'};
const PANELS=[
 {k:'circ',l:'循環',u:'mmHg・bpm',min:0,max:220,step:40,h:168,
  ser:[{k:'sys',l:'収縮期血圧',m:'d'},{k:'map',l:'平均血圧',m:'t'},
       {k:'dia',l:'拡張期血圧',m:'s'},{k:'hr',l:'心拍数',m:'x'}]},
 {k:'resp',l:'呼吸',u:'mmHg・/min',min:0,max:60,step:10,h:112,
  ser:[{k:'etco2',l:'EtCO2',m:'s'},{k:'rr',l:'呼吸数',m:'x'}],
  r:{min:80,max:100,step:5,u:'%',c:'spo2',ser:[{k:'spo2',l:'SpO2→右',m:'c'}]},
  r2:{min:0,max:5,step:1,u:'%Iso',c:'etiso',ser:[{k:'etiso',l:'EtIso→右',m:'d'}]}},
 {k:'temp',l:'体温',u:'℃',min:35,max:41,step:1,h:104,
  ser:[{k:'temp',l:'体温',m:'c'}]},
 {k:'pi',l:'PI',u:'%',min:0,max:10,step:2,h:80,
  ser:[{k:'pi',l:'PI（灌流指標）',m:'t'}]}
];
/* 印（●■▲◆×）。色だけに頼らず形でも区別できるようにします */
function mk(m,x,y,c,r){
  r=r||3.4;
  if(m==='s') return `<rect x="${x-r}" y="${y-r}" width="${r*2}" height="${r*2}" fill="${c}"/>`;
  if(m==='t') return `<polygon points="${x},${y-r-.6} ${x+r+.4},${y+r} ${x-r-.4},${y+r}" fill="${c}"/>`;
  if(m==='d') return `<polygon points="${x},${y-r-.8} ${x+r+.8},${y} ${x},${y+r+.8} ${x-r-.8},${y}" fill="${c}"/>`;
  if(m==='x') return `<path d="M${x-r} ${y-r}L${x+r} ${y+r}M${x+r} ${y-r}L${x-r} ${y+r}" stroke="${c}" stroke-width="1.9" fill="none"/>`;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
}
/* 上段の表（麻酔器・輸液・CRI）。値が変わった時刻だけ拾います */
function bandRows(c){
  const rows=[], ts=Object.keys(c.chart.v).filter(t=>hm2m(t)!=null).sort((a,b)=>hm2m(a)-hm2m(b));
  MACHINE.forEach(f=>{
    const pts=[]; let last=null;
    ts.forEach(t=>{ const v=c.chart.v[t][f.k];
      if(v==null||v==='')return;
      if(String(v)!==last){ pts.push({m:hm2m(t),v:String(v)}); last=String(v); } });
    if(pts.length) rows.push({l:f.l,u:f.u,pts,col:'#0d6e8c',bg:'#eaf4f7'});
  });
  const cri={};
  c.doses.filter(d=>d.route==='CRI').forEach(d=>{
    const m=hm2m(d.t); if(m==null)return;
    const nm=bareName(d.name)||d.name;
    const o=cri[nm]=cri[nm]||{u:(d.dunit||'').replace(/\/h$/,'/hr'),pts:[]};
    o.pts.push({m,v:(d.dose!=null&&d.dose!=='')?dnum(d.dose):(d.amt||'')});
  });
  Object.keys(cri).forEach(nm=>{ const o=cri[nm];
    o.pts.sort((a,b)=>a.m-b.m);
    rows.push({l:nm,u:o.u,pts:o.pts,col:'#6b32a0',bg:'#f2ecf8'}); });
  return rows;
}
/* 横に並ぶラベルが重ならないよう、行を下にずらします */
function stackLabels(items,gap){
  const lines=[];
  items.sort((a,b)=>a.l-b.l).forEach(it=>{
    let i=0; while(lines[i]!=null&&lines[i]>it.l-gap) i++;
    it.row=i; lines[i]=it.r;
  });
  return Math.max(1,lines.length);
}
/* 左の欄に収まる長さに切ります */
const clipTxt=(s,n)=>{ s=String(s); return s.length>n?s.slice(0,n-1)+'…':s; };
/* 画像に書き出すときだけ、画面の幅の代わりにこの幅で描きます */
let CHART_EXP=null;
function vchart(c){
  const V=c.chart.v;
  const ts=Object.keys(V).map(hm2m).filter(x=>x!=null);
  const evs=c.events.map(e=>hm2m(e.t)).filter(x=>x!=null);
  const ds=c.doses.map(d=>hm2m(d.t)).filter(x=>x!=null);
  const marks=[hm2m(c.chart.anesStart),hm2m(c.chart.anesStop)].filter(x=>x!=null);
  const all=[...ts,...evs,...ds,...marks];
  if(!all.length) return '<div class="empty">データを入力するとグラフが表示されます</div>';
  const a0=hm2m(c.chart.anesStart);
  let t0=Math.floor(Math.min(...all)/10)*10;
  const now=nowMin();
  let hi=Math.max(...all); if(now>=Math.min(...all)&&now-Math.max(...all)<720) hi=Math.max(hi,now);
  let t1=Math.ceil((hi+5)/10)*10;
  if(t1-t0<30) t1=t0+30;

  const NA=CHART_EXP?false:window.innerWidth<=560;
  /* 記録のある項目だけを描きます（使っていない帯で紙が埋まらないように）。
     右軸の本数で右の余白が決まるので、幅を決める前に組み立てます */
  const hasK=k=>Object.keys(V).some(t=>V[t][k]!=null&&V[t][k]!=='');
  const fser=x=>x?{...x,ser:x.ser.filter(y=>plotOn(y.k)&&hasK(y.k))}:null;
  let panels=PANELS.map(p=>({...p,ser:p.ser.filter(x=>plotOn(x.k)&&hasK(x.k)),
      r:fser(p.r),r2:fser(p.r2)}))
    .filter(p=>p.ser.length||(p.r&&p.r.ser.length)||(p.r2&&p.r2.ser.length));
  if(!panels.length) panels=[{...PANELS[0],ser:PANELS[0].ser.filter(x=>plotOn(x.k)),r:null,r2:null}];
  const rAxes=p=>[p.r,p.r2].filter(x=>x&&x.ser.length);
  const nR=panels.reduce((a,p)=>Math.max(a,rAxes(p).length),0);
  const LEFT=NA?92:116, RIGHT=nR?12+nR*25:14;
  /* 「全体」のときは、いま出せる幅にちょうど収めます
     （画像に書き出すときは画面の幅ではなく CHART_EXP の幅で描きます） */
  const wrap=document.querySelector('.chartwrap');
  const box=CHART_EXP||(wrap&&wrap.clientWidth)||(Math.min(window.innerWidth,1100)-56);
  const avail=box-LEFT-RIGHT-2;
  const PPM=chartZoom==='fit'
    ? Math.max(1.6,Math.min(NA?5.2:5.8,avail/(t1-t0)))
    : (NA?5.2:5.8);
  const PW=chartZoom==='fit'?Math.max(200,Math.min(avail,Math.round((t1-t0)*PPM)))
                            :Math.max(NA?400:520,Math.round((t1-t0)*PPM));
  const W=LEFT+PW+RIGHT, FS=NA?9.5:10;
  const TSTEP=PPM*10>=40?10:(PPM*10>=22?20:30);
  const X=m=>LEFT+((m-t0)/(t1-t0))*PW;
  /* 描画範囲からはみ出した時刻は端に寄せます（負の幅で描かないため） */
  const CX=m=>Math.max(LEFT,Math.min(LEFT+PW,X(m)));

  const bands=bandRows(c), BH=NA?17:18;
  const evItems=c.events.filter(e=>hm2m(e.t)!=null).map(e=>{
    const t=clipTxt(e.l,10), w=t.length*FS*0.92+10, x=X(hm2m(e.t));
    return {x,t:esc(t),w,l:x-w/2,r:x+w/2};});
  const dsItems=c.doses.filter(d=>hm2m(d.t)!=null&&d.route!=='CRI').map(d=>{
    const t='▼'+clipTxt(bareName(d.name)||d.name,7), w=t.length*FS*0.9+6, x=X(hm2m(d.t));
    return {x,t:esc(t),w,l:x-4,r:x-4+w};});
  const evRows=evItems.length?stackLabels(evItems,10):0;
  const dsRows=dsItems.length?stackLabels(dsItems,8):0;

  const HEAD=bands.length?20:0;
  const BAND=bands.length?bands.length*BH+HEAD+8:0;
  const PT=BAND+6, PH=panels.reduce((a,p)=>a+p.h+8,0);
  const AXY=PT+PH+2, AXH=a0!=null?34:22;
  const DSY=AXY+AXH, DSH=dsRows*(FS+4);
  const EVY=DSY+DSH+(dsRows?4:0), EVH=evRows*(FS+8);
  const H=EVY+EVH+8;

  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  /* --- 時間の目盛り（10分ごと） --- */
  const gridX=[];
  for(let m=t0;m<=t1;m+=10) gridX.push(m);
  const isTick=m=>((m-t0)%TSTEP)===0;
  if(bands.length){
    g+=`<text x="4" y="${HEAD-6}" font-size="${FS}" font-weight="800" fill="#5c6b7a">時間</text>`;
    gridX.forEach(m=>{ if(!isTick(m))return;
      g+=`<text x="${X(m)}" y="${HEAD-6}" font-size="${FS}" font-weight="700" fill="#7d8b99" text-anchor="middle">${
        a0!=null?(m-a0):m2hm(m)}</text>`; });
  }
  /* --- 上段：麻酔器・輸液・CRI の段 --- */
  bands.forEach((b,i)=>{
    const y=HEAD+i*BH;
    g+=`<rect x="${LEFT}" y="${y}" width="${PW}" height="${BH-1}" fill="${b.bg}"/>`;
    g+=`<text x="4" y="${y+BH-6}" font-size="${FS-.5}" font-weight="800" fill="#3d4a57">${esc(clipTxt(b.l,NA?6:8))}</text>`;
    g+=`<text x="${LEFT-4}" y="${y+BH-6}" font-size="${FS-2.5}" fill="#8b98a5" text-anchor="end">${esc(b.u||'')}</text>`;
    b.pts.forEach((p,j)=>{
      const x=CX(p.m), xe=Math.max(x,j+1<b.pts.length?CX(b.pts[j+1].m):LEFT+PW);
      g+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+BH-1}" stroke="${b.col}" stroke-width="1.4"/>`;
      g+=`<text x="${x+3}" y="${y+BH-6}" font-size="${FS}" font-weight="800" fill="${b.col}">${esc(p.v)}</text>`;
    });
  });
  if(bands.length) g+=`<line x1="0" y1="${HEAD+bands.length*BH+3}" x2="${W}" y2="${HEAD+bands.length*BH+3}" stroke="#dfe6ee"/>`;

  /* --- 中段：パネル --- */
  let py=PT;
  panels.forEach(p=>{
    const top=py, bot=py+p.h;
    const Y=(v,s)=>bot-((v-s.min)/(s.max-s.min))*(p.h);
    /* 縞（読み取り用） */
    let n=0;
    for(let v=p.min;v<p.max;v+=p.step){
      const y1=Y(v+p.step,p), y2=Y(v,p);
      if(n%2===0) g+=`<rect x="${LEFT}" y="${y1}" width="${PW}" height="${y2-y1}" fill="#fdf8e3"/>`;
      n++;
    }
    g+=`<rect x="${LEFT}" y="${top}" width="${PW}" height="${p.h}" fill="none" stroke="#dfe6ee"/>`;
    for(let v=p.min;v<=p.max;v+=p.step){ const y=Y(v,p);
      g+=`<line x1="${LEFT}" y1="${y}" x2="${LEFT+PW}" y2="${y}" stroke="#e7edf3"/>`;
      g+=`<text x="${LEFT-4}" y="${y+3.2}" font-size="${FS-1}" fill="#7d8b99" text-anchor="end">${v}</text>`; }
    /* 右の目盛り。SpO2 と EtIso のように、値の幅がまったく違うものは別々の軸で描きます */
    const rax=rAxes(p);
    rax.forEach((sc,ri)=>{
      const rc=VCOL[sc.c]||'#333', xo=LEFT+PW+4+ri*25;
      for(let v=sc.min;v<=sc.max;v+=sc.step){ const y=bot-((v-sc.min)/(sc.max-sc.min))*p.h;
        g+=`<text x="${xo}" y="${y+3.2}" font-size="${FS-1.5}" fill="${rc}">${v}</text>`; }
      g+=`<text x="${xo}" y="${top-3}" font-size="${FS-2}" font-weight="800" fill="${rc}">${esc(sc.u)}</text>`;
    });
    /* 時間の縦線 */
    gridX.forEach(m=>{ g+=`<line x1="${X(m)}" y1="${top}" x2="${X(m)}" y2="${bot}" stroke="${isTick(m)?'#dbe3ec':'#f1f5f8'}"/>`; });
    /* 手術中の帯 */
    const o0=hm2m(c.chart.opeStart), o1=hm2m(c.chart.opeStop);
    if(o0!=null){ const x1=CX(o0), x2=Math.max(x1,o1!=null?CX(o1):LEFT+PW);
      if(x2>x1) g+=`<rect x="${x1}" y="${top}" width="${x2-x1}" height="${p.h}" fill="#c0392b" opacity=".05"/>`; }
    /* 系列 */
    const draw=(sers,sc)=>sers.forEach(sv=>{
      const col=VCOL[sv.k]||'#333';
      const pts=Object.keys(V).map(t=>({m:hm2m(t),v:parseFloat(V[t][sv.k])}))
        .filter(q=>q.m!=null&&isFinite(q.v)).sort((a,b)=>a.m-b.m);
      if(!pts.length)return;
      const cl=q=>Math.max(sc.min,Math.min(sc.max,q));
      if(pts.length>1) g+=`<polyline points="${pts.map(q=>`${X(q.m)},${bot-((cl(q.v)-sc.min)/(sc.max-sc.min))*p.h}`).join(' ')}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".85"/>`;
      pts.forEach(q=>{ g+=mk(sv.m,X(q.m),bot-((cl(q.v)-sc.min)/(sc.max-sc.min))*p.h,col); });
    });
    draw(p.ser,p); rax.forEach(sc=>draw(sc.ser,sc));
    /* 左の凡例 */
    const leg=p.ser.concat(...rax.map(sc=>sc.ser));
    const lh=Math.min(11,(p.h-16)/Math.max(1,leg.length));
    g+=`<text x="4" y="${top+11}" font-size="${FS}" font-weight="800" fill="#3d4a57">${esc(p.l)}</text>`;
    g+=`<text x="4" y="${top+22}" font-size="${FS-2}" fill="#8b98a5">${esc(p.u)}</text>`;
    leg.forEach((sv,i)=>{ const y=top+34+i*lh+lh/2, col=VCOL[sv.k]||'#333';
      g+=mk(sv.m,11,y-3,col,2.8);
      g+=`<text x="19" y="${y}" font-size="${FS-1.5}" font-weight="700" fill="${col}">${esc(clipTxt(sv.l,NA?6:7))}</text>`; });
    py=bot+8;
  });

  /* --- 時間軸 --- */
  g+=`<line x1="${LEFT}" y1="${AXY}" x2="${LEFT+PW}" y2="${AXY}" stroke="#8b98a5" stroke-width="1.2"/>`;
  gridX.forEach(m=>{
    g+=`<line x1="${X(m)}" y1="${AXY}" x2="${X(m)}" y2="${AXY+4}" stroke="#8b98a5"/>`;
    if(!isTick(m))return;
    g+=`<text x="${X(m)}" y="${AXY+15}" font-size="${FS}" font-weight="800" fill="#5c6b7a" text-anchor="middle">${esc(m2hm(m))}</text>`;
    if(a0!=null) g+=`<text x="${X(m)}" y="${AXY+26}" font-size="${FS-1.5}" fill="#8b98a5" text-anchor="middle">${m-a0>=0?'+'+(m-a0):(m-a0)}分</text>`;
  });
  g+=`<text x="4" y="${AXY+15}" font-size="${FS}" font-weight="800" fill="#5c6b7a">時刻</text>`;
  if(a0!=null) g+=`<text x="4" y="${AXY+26}" font-size="${FS-1.5}" fill="#8b98a5">導入から</text>`;

  /* --- 単回投与 --- */
  dsItems.forEach(it=>{
    g+=`<text x="${Math.min(it.x-4,LEFT+PW-it.w)}" y="${DSY+(it.row+1)*(FS+4)-3}" font-size="${FS}" font-weight="700" fill="#6b32a0">${it.t}</text>`; });
  /* --- イベント --- */
  if(evItems.length){
    c.events.forEach(e=>{ const m=hm2m(e.t); if(m==null)return;
      g+=`<line x1="${X(m)}" y1="${PT}" x2="${X(m)}" y2="${AXY}" stroke="#0d6e8c" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>`; });
    evItems.forEach(it=>{
      const y=EVY+it.row*(FS+8), x=Math.max(LEFT,Math.min(it.x-it.w/2,LEFT+PW-it.w));
      g+=`<line x1="${it.x}" y1="${AXY}" x2="${it.x}" y2="${y}" stroke="#0d6e8c" stroke-width="1" opacity=".5"/>`;
      g+=`<rect x="${x}" y="${y}" width="${it.w}" height="${FS+6}" rx="3" fill="#eaf4f7" stroke="#0d6e8c" stroke-width=".9"/>`;
      g+=`<text x="${x+it.w/2}" y="${y+FS+1}" font-size="${FS}" font-weight="800" fill="#0d6e8c" text-anchor="middle">${it.t}</text>`;
    });
  }
  return `<svg class="vchart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function logRows(c){
  const rows=[];
  Object.keys(c.chart.v).forEach(t=>{
    const o=c.chart.v[t], parts=allFields().filter(v=>o[v.k]!=null&&o[v.k]!=='')
      .map(v=>`${v.l} ${o[v.k]}`);
    if(parts.length) rows.push({t,tag:'',b:parts.join(' ・ '),kind:'v'});
  });
  c.events.forEach((e,i)=>rows.push({t:e.t,tag:'イベント',
    b:e.l+(e.memo?` — ${e.memo}`:''),kind:'e',i}));
  c.doses.forEach((d,i)=>{ const pk=perKg(d,bw(c));
    rows.push({t:d.t,tag:'投薬',
    b:`${d.name} ${pk||''}${d.amt?`（${d.amt} ${d.unit||'mL'}）`:''}${d.route?' '+d.route:''}`
      +(d.by?` ・ ${d.by}${d.ord?`（指示 ${d.ord}）`:''}`:''),kind:'d',i}); });
  rows.sort((a,b)=>String(a.t).localeCompare(String(b.t)));
  if(!rows.length) return '<div class="empty">まだ記録がありません</div>';
  /* 行をタップするとその場で直せます（時刻を合わせ直したり、消して作り直す必要がありません） */
  return rows.map(r=>{
    const go=r.kind==='v'?`editVital('${esc(r.t)}')`:`editLog('${r.kind}',${r.i})`;
    return `<div class="logrow tap" onclick="${go}">
      <span class="t">${esc(r.t)}</span>
      ${r.tag?`<span class="tag ${r.kind==='e'?'ev':'dg'}">${r.tag}</span>`:''}
      <span class="b">${esc(r.b)}</span>
      <span class="x" aria-hidden="true">›</span></div>`;
  }).join('');
}

/* ---- 記録一覧からの編集 ---- */
function editLog(kind,i){ kind==='e'?editEvent(i):editDose(i); }
function editEvent(i){
  const e=cur.events[i]; if(!e) return;
  const ev=EVENTS.find(x=>x.k===evKind(e));
  openModal(`<h2>イベント</h2>
   <div class="grid g2">
     <label class="f"><span>時刻</span><input type="time" id="ee_t" value="${esc(e.t||'')}"></label>
     <label class="f"><span>内容</span><input id="ee_l" value="${esc(e.l||'')}" maxlength="40"></label>
   </div>
   <label class="f" style="margin-top:8px"><span>メモ</span>
     <input id="ee_m" value="${esc(e.memo||'')}" placeholder="例）VPC 連発、リドカイン準備" maxlength="80"></label>
   ${ev&&ev.stamp?'<p class="muted" style="font-size:12px;margin:8px 0 0">時刻を直すと、上の5つのボタンの時刻も一緒に直ります。</p>':''}
   <div class="row" style="margin-top:12px">
     <button class="btn sp" onclick="closeModal()">キャンセル</button>
     <button class="btn primary sp" onclick="editEventOk(${i})">直す</button></div>
   <div class="row" style="margin-top:8px">
     <button class="btn danger sp" onclick="delLog('e',${i})">このイベントを削除</button></div>`);
  setTimeout(()=>{const n=document.getElementById('ee_m'); if(n&&!e.memo)n.focus();},80);
}
function editEventOk(i){
  const e=cur.events[i]; if(!e) return;
  const t=document.getElementById('ee_t').value, l=document.getElementById('ee_l').value.trim();
  if(!t){ toast('時刻を入れてください'); return; }
  if(!l){ toast('内容を入れてください'); return; }
  const old=e.t, ev=EVENTS.find(x=>x.k===evKind(e));
  e.t=t; e.l=l;
  const m=document.getElementById('ee_m').value.trim();
  if(m) e.memo=m; else delete e.memo;
  /* 5つの時刻と連動しているイベントは、そちらも一緒に直します */
  if(ev&&ev.stamp&&cur.chart[ev.stamp]===old){ cur.chart[ev.stamp]=t;
    if(ev.stamp==='anesStart'&&cur.chart.start===old) cur.chart.start=t; }
  save(); closeModal(); render(); toast('直しました');
}
function editDose(i){
  const d=cur.doses[i]; if(!d) return;
  openModal(`<h2>投薬</h2>
   <p class="muted" style="font-size:13px;margin:0 0 10px">${esc(d.name)}${
     d.pot?` ・ ${esc(d.pot)}`:''}${perKg(d,bw(cur))?` ・ ${esc(perKg(d,bw(cur)))}`:''}</p>
   <div class="grid g2">
     <label class="f"><span>時刻</span><input type="time" id="ed_t" value="${esc(d.t||'')}"></label>
     <label class="f"><span>実投与量（${esc(d.unit||'mL')}）</span>
       <input id="ed_a" inputmode="decimal" value="${esc(d.amt||'')}"></label>
   </div>

    const gone=(cur.alerts||[]).filter(a=>
      (a.ev&&a.ev===e.k)||(evKind(e)==='abx'&&a.src==='abx'&&!a.ev));
    if(gone.length){
      cur.alerts=cur.alerts.filter(a=>gone.indexOf(a)<0);
      gone.forEach(a=>delete ALERT_FIRED[cur.id+'|'+a.k]);
    }
    cur.events.splice(i,1);

    toast(gone.length?`イベントと通知 ${gone.length}件 を消しました`:`${e.l} を消しました`);

  const d=cur.doses[i];

const jpDate=s=>{const m=String(s).match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  return m?`${m[1]}年${+m[2]}月${+m[3]}日`:String(s||'');};

/* 同じ薬は1つにまとめ、用量に幅があれば 3-5mcg/kg のように書く */
function catLine(c,cat){
  const w=bw(c), g={};
  c.doses.filter(d=>(d.cat||guessCat(d.name,d.t,c))===cat).forEach(d=>{
    /* 「（10倍希釈）」などは調製の話なので報告書には書きません */
    const nm=bareName(d.name)||d.name, k=nm+'|'+(d.route||'');
    (g[k]=g[k]||{n:nm,r:d.route||'',v:[]}).v.push(perKg(d,w));
  });
  return Object.values(g).map(o=>{
    const nums=o.v.filter(Boolean).map(s=>({x:parseFloat(s),u:s.replace(/^[\d.]+/,'')}));
    let dose='';
    if(nums.length){
      const u=nums[0].u;
      if(nums.every(n=>n.u===u)){
        const xs=[...new Set(nums.map(n=>n.x))].sort((a,b)=>a-b);
        dose=(xs.length>1?`${xs[0]}-${xs[xs.length-1]}`:`${xs[0]}`)+u;
      } else dose=o.v.filter(Boolean).join('／');
    }

function repVal(c,k){ const v=(c.rep||{})[k]; if(v!=null&&v!=='') return v;
  if(k==='maint') return maintAuto(c);
